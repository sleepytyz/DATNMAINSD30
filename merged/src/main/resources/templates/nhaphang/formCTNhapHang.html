<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Chi tiết phiếu nhập</title>
</head>
<body>

<div th:fragment="formCTNhapHang">

    <style>
        .detail-panel {
            background: #fff;
            border: 1px solid #E5E7EB;
            border-radius: 10px;
            font-size: 13px;
            display: flex;
            flex-direction: column;
            position: sticky;
            top: 80px;
            max-height: calc(100vh - 100px);
            overflow-y: auto;
        }

        /* Header */
        .panel-topbar {
            padding: 12px 14px;
            border-bottom: 1px solid #E5E7EB;
            display: flex; align-items: center; justify-content: space-between;
            font-weight: 700; font-size: 13.5px;
            position: sticky; top: 0; background: #fff; z-index: 1;
        }
        .panel-close {
            background: none; border: none; cursor: pointer;
            font-size: 16px; color: #6B7280; line-height: 1;
        }
        .panel-close:hover { color: #1A1A1A; }

        /* Sections */
        .panel-section { padding: 12px 14px; border-bottom: 1px solid #E5E7EB; }
        .panel-section h4 { font-weight: 700; font-size: 13px; margin-bottom: 8px; }

        /* Info rows */
        .info-row {
            display: flex; gap: 6px; margin-bottom: 6px;
            align-items: flex-start; font-size: 12.5px;
        }
        .info-label { color: #6B7280; min-width: 110px; flex-shrink: 0; }
        .info-val   { font-weight: 500; word-break: break-word; }
        .info-val.red { color: #E53935; font-weight: 700; }

        /* Badge thanh toán */
        .pay-badge {
            display: inline-block; padding: 2px 10px; border-radius: 20px;
            font-size: 11.5px; font-weight: 600;
            background: #EFF6FF; color: #2563EB; border: 1px solid #BFDBFE;
        }

        /* Tag trạng thái */
        .tag-status {
            display: inline-block; padding: 3px 10px; border-radius: 20px;
            font-size: 11.5px; font-weight: 600;
        }
        .tag-cho  { background: #FFF7ED; color: #C2410C; border: 1px solid #FED7AA; }
        .tag-xac  { background: #ECFDF5; color: #065F46; border: 1px solid #6EE7B7; }
        .tag-nhap { background: #EFF6FF; color: #1E40AF; border: 1px solid #BFDBFE; }
        .tag-huy  { background: #FEF2F2; color: #991B1B; border: 1px solid #FECACA; }

        /* Danh sách sản phẩm */
        .sp-item {
            display: flex; align-items: center; gap: 10px;
            padding: 8px 0; border-bottom: 1px solid #E5E7EB;
        }
        .sp-item:last-child { border-bottom: none; }
        .sp-thumb {
            width: 38px; height: 38px; border-radius: 5px;
            background: #F5F6FA; border: 1px solid #E5E7EB;
            display: flex; align-items: center; justify-content: center;
            color: #C4C9D4; font-size: 16px; flex-shrink: 0;
        }
        .sp-info { flex: 1; min-width: 0; }
        .sp-name { font-weight: 600; font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .sp-meta { font-size: 11px; color: #6B7280; margin-top: 1px; }
        .sp-price { font-weight: 700; font-size: 12.5px; white-space: nowrap; }

        /* Ghi chú */
        .note-box { padding: 12px 14px; border-bottom: 1px solid #E5E7EB; }
        .note-box label { font-size: 12px; color: #6B7280; display: block; margin-bottom: 5px; }
        .note-box textarea {
            width: 100%; border: 1.5px solid #E5E7EB; border-radius: 6px;
            padding: 8px 10px; font-size: 12.5px; resize: none; outline: none;
            font-family: inherit; line-height: 1.5;
        }
        .note-box textarea:focus { border-color: #9CA3AF; }
        .note-box textarea::placeholder { color: #B0B7C3; }

        /* Actions */
        .panel-actions {
            padding: 12px 14px;
            display: flex; gap: 8px;
            position: sticky; bottom: 0; background: #fff;
        }
        .btn-cancel-panel {
            flex: 1; padding: 9px; border-radius: 6px;
            border: 1.5px solid #E5E7EB; background: #fff;
            font-size: 13px; font-weight: 600; cursor: pointer;
            transition: border-color .15s;
        }
        .btn-cancel-panel:hover { border-color: #9CA3AF; }
        .btn-confirm-panel {
            flex: 1.6; padding: 9px; border-radius: 6px;
            border: none; background: #E53935;
            font-size: 13px; font-weight: 700; cursor: pointer; color: #fff;
            transition: background .15s;
        }
        .btn-confirm-panel:hover { background: #B71C1C; }
    </style>

    <div class="detail-panel">

        <!-- Topbar -->
        <div class="panel-topbar">
            <span>Thông tin nhà cung cấp</span>
            <form th:action="@{/nhap-hang/index}" method="get" style="display:inline">
                <button type="submit" class="panel-close" title="Đóng">✕</button>
            </form>
        </div>

        <!-- Nhà cung cấp -->
        <div class="panel-section">
            <div class="info-row">
                <span class="info-label">Tên NCC</span>
                <span class="info-val" th:text="${ctNhapHang.tenNhaCungCap}"></span>
            </div>
            <div class="info-row">
                <span class="info-label">Số điện thoại</span>
                <span class="info-val" th:text="${ctNhapHang.sdt}"></span>
            </div>
            <div class="info-row">
                <span class="info-label">Địa chỉ</span>
                <span class="info-val" th:text="${ctNhapHang.diaChi}"></span>
            </div>
        </div>

        <!-- Thông tin nhập hàng -->
        <div class="panel-section">
            <h4>Thông tin nhập hàng</h4>
            <div class="info-row">
                <span class="info-label">Mã nhập hàng</span>
                <span class="info-val" th:text="${ctNhapHang.maPhieuNhap}"></span>
            </div>
            <div class="info-row">
                <span class="info-label">Ngày tạo</span>
                <span class="info-val" th:text="${ctNhapHang.ngayTao}"></span>
            </div>
            <div class="info-row">
                <span class="info-label">Nhân viên tạo</span>
                <span class="info-val" th:text="${ctNhapHang.tenNhanVien}"></span>
            </div>
            <div class="info-row">
                <span class="info-label">Tổng tiền</span>
                <span class="info-val red" th:text="${ctNhapHang.tongTien}"></span>
            </div>
            <div class="info-row">
                <span class="info-label">Trạng thái</span>
                <span class="tag-status"
                      th:classappend="${ctNhapHang.trangThai == 'Chờ xử lý'}   ? 'tag-cho'
                                   : (${ctNhapHang.trangThai == 'Đã nhận'} ? 'tag-xac'
                                   : (${ctNhapHang.trangThai == 'Đang vận chuyển'} ? 'tag-nhap'
                                   : 'tag-huy'))"
                      th:text="${ctNhapHang.trangThai}">
                </span>
            </div>
        </div>

        <!-- Danh sách sản phẩm -->
        <div class="panel-section">
            <h4>Danh sách sản phẩm</h4>
            <div th:each="sp : ${ctNhapHang.sanPhamDetails}" class="sp-item">
                <div class="sp-thumb">
                    <i class="bi bi-box-seam"></i>
                </div>
                <div class="sp-info">
                    <div class="sp-name" th:text="${sp.tenSanPham}"></div>
                    <div class="sp-meta" th:text="${'Size ' + sp.size + ' | SL: ' + sp.soLuong}"></div>
                </div>
                <div class="sp-price" th:text="${sp.thanhTien}"></div>
            </div>
        </div>

        <!-- Ghi chú -->
        <div class="note-box">
            <label>Ghi chú</label>
            <textarea rows="3" placeholder="Nhập ghi chú cho đơn hàng..."></textarea>
        </div>

        <!-- Hành động -->
        <div class="panel-actions">
            <form th:action="@{/nhap-hang/cancel/{id}(id=${ctNhapHang.maPhieuNhap})}"
                  method="post" style="flex:1">
                <button type="submit" class="btn-cancel-panel"
                        onclick="return confirm('Bạn có chắc muốn hủy phiếu này?')">
                    Hủy phiếu này
                </button>
            </form>
            <form th:action="@{/nhap-hang/confirm/{id}(id=${ctNhapHang.maPhieuNhap})}"
                  method="post" style="flex:1.6">
                <button type="submit" class="btn-confirm-panel">
                    Xác nhận nhập
                </button>
            </form>
        </div>

    </div>

</div>

</body>
</html>
