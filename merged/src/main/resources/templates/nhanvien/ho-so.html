<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Thông tin cá nhân</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .profile-card { background:#fff; border:1px solid #E5E7EB; border-radius:10px; padding:24px; max-width:640px; }
        .profile-tabs a { padding:8px 16px; border-radius:8px; text-decoration:none; color:#374151; font-weight:600; font-size:14px; margin-right:8px; }
        .profile-tabs a.active { background:#E53935; color:#fff; }
        .field { margin-bottom: 16px; }
        .field label { display:block; font-weight:600; font-size:13.5px; margin-bottom:6px; }
        .field input, .field select { width:100%; padding:9px 12px; border:1px solid #D1D5DB; border-radius:8px; font-size:14px; }
        .field-error { color:#E53935; font-size:12.5px; margin-top:4px; }
    </style>
</head>
<body>
<div class="wrapper">
    <div sec:authorize="hasRole('STAFF')" th:replace="~{fragments/sidebarstaff :: sidebar-staff}"></div>
    <div sec:authorize="hasRole('ADMIN')" th:replace="~{fragments/sidebaradmin :: sidebar-admin}"></div>

    <div class="content-wrapper">
        <div th:replace="~{fragments/header :: header('Thông tin cá nhân', 'Tài khoản của tôi')}"></div>

        <div class="content-body">
            <div class="page-title" style="font-size:22px;font-weight:700;">Thông tin cá nhân</div>
            <div class="page-sub" style="font-size:13px;color:#6B7280;margin-bottom:18px;">
                Quản lý hồ sơ và mật khẩu đăng nhập của chính bạn
            </div>

            <div class="profile-tabs" style="margin-bottom:18px;">
                <a href="/nv-ca-nhan" class="active"><i class="bi bi-person"></i> Hồ sơ</a>
                <a href="/nv-ca-nhan/doi-mat-khau"><i class="bi bi-shield-lock"></i> Đổi mật khẩu</a>
            </div>

            <div class="alert alert-success" th:if="${thongBao}" th:text="${thongBao}"></div>
            <div class="alert alert-danger" th:if="${loi}" th:text="${loi}"></div>

            <div class="profile-card" th:if="${nhanVien != null}">
                <form th:action="@{/nv-ca-nhan/cap-nhat}" th:object="${nhanVien}" method="post">
                    <div class="mb-3 text-muted" style="font-size:13px;">
                        Mã nhân viên: <strong th:text="${nhanVien.maNhanVien}"></strong>
                        &nbsp;|&nbsp; Tên đăng nhập: <strong th:text="${nhanVien.taiKhoan != null ? nhanVien.taiKhoan.tenDangNhap : ''}"></strong>
                    </div>

                    <div class="field">
                        <label>Họ và tên</label>
                        <input type="text" th:field="*{hoTen}">
                        <div class="field-error" th:if="${#fields.hasErrors('hoTen')}" th:errors="*{hoTen}"></div>
                    </div>

                    <div class="field">
                        <label>Số điện thoại</label>
                        <input type="text" th:field="*{soDienThoai}">
                        <div class="field-error" th:if="${#fields.hasErrors('soDienThoai')}" th:errors="*{soDienThoai}"></div>
                    </div>

                    <div class="field">
                        <label>Email</label>
                        <input type="email" th:field="*{email}">
                        <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                    </div>

                    <div class="field">
                        <label>Ngày sinh</label>
                        <input type="date" th:field="*{ngaySinh}">
                        <div class="field-error" th:if="${#fields.hasErrors('ngaySinh')}" th:errors="*{ngaySinh}"></div>
                    </div>

                    <div class="field">
                        <label>Giới tính</label>
                        <select th:field="*{gioiTinh}">
                            <option value="true">Nam</option>
                            <option value="false">Nữ</option>
                        </select>
                    </div>

                    <div class="field">
                        <label>Địa chỉ</label>
                        <input type="text" th:field="*{diaChi}">
                        <div class="field-error" th:if="${#fields.hasErrors('diaChi')}" th:errors="*{diaChi}"></div>
                    </div>

                    <button type="submit" class="btn btn-danger"><i class="bi bi-save"></i> Lưu thay đổi</button>
                </form>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
