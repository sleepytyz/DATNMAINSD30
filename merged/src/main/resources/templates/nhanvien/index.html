<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Quản Lý Nhân Viên</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>

    <meta name="successMess" th:content="${successMess}">
    <meta name="errorMess" th:content="${mess}">

    <style>
        /* ===== TOAST ===== */
        .toast-container-custom {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            max-width: 420px;
            width: 100%;
        }
        .toast-custom {
            background: #fff;
            border-radius: 12px;
            padding: 16px 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
            border-left: 5px solid #dc3545;
            animation: slideInRight 0.4s ease;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 12px;
        }
        .toast-custom.success { border-left-color: #28a745; }
        .toast-custom.warning { border-left-color: #ffc107; }
        .toast-custom.error { border-left-color: #dc3545; }
        .toast-custom .toast-icon { font-size: 1.5rem; flex-shrink: 0; margin-top: 2px; }
        .toast-custom .toast-content { flex: 1; }
        .toast-custom .toast-title { font-weight: 700; font-size: 0.95rem; color: #2d3748; }
        .toast-custom .toast-message { font-size: 0.85rem; color: #6c757d; margin-top: 2px; white-space: pre-line; }
        .toast-custom .toast-close {
            background: none;
            border: none;
            font-size: 1.2rem;
            color: #adb5bd;
            cursor: pointer;
            padding: 0 4px;
            transition: color 0.2s;
        }
        .toast-custom .toast-close:hover { color: #dc3545; }
        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes slideOutRight {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(100%); opacity: 0; }
        }

        .action-column {
            min-width: 130px;
            padding: 0 10px !important;
        }
        .action-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }
        .toggle-link {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 5px;
            text-decoration: none;
            cursor: pointer;
            background: none;
            border: none;
        }
        .toggle-link i {
            font-size: 1.8rem;
            color: #dc3545;
        }
        .toggle-link i.bi-toggle-on {
            color: #28a745;
        }
        .toggle-link i.bi-toggle-off {
            color: #dc3545;
        }
        .toggle-link.disabled {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
        }

        /* ===== PAGINATION GIỐNG TRANG SẢN PHẨM CHI TIẾT ===== */
        .pagination-custom {
            display: flex;
            align-items: center;
            gap: 4px;
            margin: 0;
            padding: 0;
            list-style: none;
            flex-wrap: wrap;
        }
        .pagination-custom .page-item {
            display: inline-block;
        }
        .pagination-custom .page-item .page-link {
            border: none;
            border-radius: 8px;
            padding: 6px 14px;
            color: #495057;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.3s ease;
            background: transparent;
            min-width: 36px;
            text-align: center;
            text-decoration: none;
            display: block;
        }
        .pagination-custom .page-item .page-link:hover {
            background: #fff5f5;
            color: #c92327;
        }
        .pagination-custom .page-item.active .page-link {
            background: linear-gradient(135deg, #c92327, #a01a1e);
            color: white;
            box-shadow: 0 2px 8px rgba(201, 35, 39, 0.3);
        }
        .pagination-custom .page-item.disabled .page-link {
            color: #adb5bd;
            cursor: not-allowed;
            pointer-events: none;
            opacity: 0.5;
        }

        /* ===== TABLE FOOTER ===== */
        .table-footer {
            background: #f8f9fa;
            padding: 12px 20px;
            border-top: 1px solid #e9ecef;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            border-radius: 0 0 16px 16px;
        }
        .table-footer .info-text {
            font-size: 0.85rem;
            color: #6c757d;
        }
        .table-footer .info-text strong {
            color: #2d3748;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .table-footer {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }
            .pagination-custom .page-item .page-link {
                padding: 4px 10px;
                font-size: 0.75rem;
                min-width: 30px;
            }
        }

        /* Card */
        .card-custom {
            border-radius: 16px;
            border: none;
            overflow: hidden;
        }
        .card-custom .card-header {
            border-bottom: none;
            padding: 14px 20px;
        }
        /* ===== SEARCH SUGGESTIONS ===== */
        .search-wrapper {
            position: relative;
            width: 100%;
            z-index: 99 !important;
        }

        .search-wrapper .input-group {
            position: relative;
            z-index: 1;
        }

        .suggestions-dropdown {
            position: fixed !important;
            background: #ffffff;
            border: 1px solid #d1d5db;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
            max-height: 400px !important;
            min-height: 60px;
            overflow-y: auto !important;
            z-index: 999999 !important;
            display: none !important;
            min-width: 350px;
            max-width: 500px;
            width: auto;
            padding: 6px 0;
        }

        .suggestions-dropdown.show {
            display: block !important;
        }

        .suggestions-dropdown .suggestion-item {
            padding: 10px 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #f3f4f6;
            transition: all 0.15s ease;
            min-height: 44px;
        }

        .suggestions-dropdown .suggestion-item:last-child {
            border-bottom: none;
        }

        .suggestions-dropdown .suggestion-item:hover {
            background: #fef2f2;
        }

        .suggestions-dropdown .suggestion-item .suggestion-code {
            font-weight: 700;
            color: #dc2626;
            font-size: 0.82rem;
            min-width: 80px;
            flex-shrink: 0;
            background: #fef2f2;
            padding: 2px 10px;
            border-radius: 6px;
            text-align: center;
        }

        .suggestions-dropdown .suggestion-item .suggestion-info {
            flex: 1;
            min-width: 0;
        }

        .suggestions-dropdown .suggestion-item .suggestion-name {
            font-size: 0.9rem;
            color: #1f2937;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .suggestions-dropdown .suggestion-item .suggestion-detail {
            font-size: 0.75rem;
            color: #6c757d;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 2px;
        }

        .suggestions-dropdown .suggestion-item .suggestion-detail .badge {
            font-size: 0.65rem;
            padding: 2px 8px;
        }

        .suggestions-dropdown .suggestion-item .highlight {
            color: #dc2626;
            font-weight: 700;
            background: #fef2f2;
            padding: 0 4px;
            border-radius: 3px;
        }

        .suggestions-dropdown .suggestion-empty {
            padding: 20px;
            text-align: center;
            color: #6b7280;
            font-size: 0.9rem;
        }

        .suggestions-dropdown .suggestion-loading {
            padding: 18px;
            text-align: center;
            color: #6b7280;
            font-size: 0.85rem;
        }

        .suggestions-dropdown .suggestion-loading .spinner-border {
            width: 1.2rem;
            height: 1.2rem;
            margin-right: 10px;
        }

        .suggestions-dropdown::-webkit-scrollbar {
            width: 6px;
        }

        .suggestions-dropdown::-webkit-scrollbar-track {
            background: #f3f4f6;
            border-radius: 10px;
        }

        .suggestions-dropdown::-webkit-scrollbar-thumb {
            background: #dc2626;
            border-radius: 10px;
        }

        .suggestions-dropdown::-webkit-scrollbar-thumb:hover {
            background: #b91c1c;
        }
    </style>
</head>
<body>

<div class="wrapper">
    <div sec:authorize="hasRole('ADMIN')">
        <div th:replace="fragments/sidebaradmin :: sidebar-admin"></div>
    </div>

    <div sec:authorize="hasRole('STAFF')">
        <div th:replace="fragments/sidebarstaff :: sidebar-staff"></div>
    </div>

    <div class="content-body">
        <div th:replace="fragments/header :: header('Quản lý nhân viên', 'Nhân viên')"></div>

        <div class="page-content">
            <div class="toast-container-custom" id="toastContainer"></div>

            <div class="card card-custom mb-4 shadow-sm">
                <div class="card-header text-white" style="background:#c92327;">
                    <h5 class="mb-0"><i class="bi bi-funnel-fill me-2"></i>Bộ lọc tìm kiếm</h5>
                </div>
                <form method="GET" th:action="@{/nhan-vien}" class="card-body">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label fw-medium">Từ khóa</label>
                            <div class="search-wrapper">
                                <div class="input-group">
                                    <input type="text"
                                           class="form-control"
                                           id="searchInput"
                                           name="keyword"
                                           th:value="${keyword}"
                                           placeholder="Tìm theo mã, tên hoặc số điện thoại..."
                                           autocomplete="off">
                                    <button type="submit" class="btn btn-danger" id="searchButton">
                                        <i class="bi bi-search"></i>
                                    </button>
                                    <div class="suggestions-dropdown" id="suggestionsDropdown">
                                        <div class="suggestion-loading" style="display: none;">
                                            <div class="spinner-border text-danger spinner-border-sm" role="status">
                                                <span class="visually-hidden">Loading...</span>
                                            </div>
                                            Đang tìm kiếm...
                                        </div>
                                        <div id="suggestionsList"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-medium">Chức vụ</label>
                            <select class="form-select" name="role" onchange="this.form.submit()">
                                <option value="">Tất cả</option>
                                <option value="Quản lý" th:selected="${role == 'Quản lý'}">Quản lý</option>
                                <option value="Nhân viên" th:selected="${role == 'Nhân viên'}">Nhân viên</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-medium">Trạng thái</label>
                            <select class="form-select" name="status" onchange="this.form.submit()">
                                <option value="">Tất cả</option>
                                <option value="1" th:selected="${status == '1'}">Đang làm việc</option>
                                <option value="0" th:selected="${status == '0'}">Đã nghỉ việc</option>
                            </select>
                        </div>
                        <div class="col-md-2 d-flex align-items-end gap-2">

                            <a th:href="@{/nhan-vien}" class="btn btn-outline-secondary w-100"><i class="bi bi-arrow-clockwise"></i> Clear</a>
                        </div>
                    </div>
                </form>
            </div>

            <div class="card shadow-sm border-0" style="border-radius: 16px; overflow: hidden;">
                <div class="card-body p-0">
                    <div class="d-flex justify-content-between align-items-center p-3 border-bottom">
                        <h5 class="mb-0 fw-bold text-secondary">
                            Danh Sách Nhân Viên
                        </h5>
                        <div class="d-flex gap-2">
                            <a th:href="@{/nhan-vien/export-excel(keyword=${keyword}, role=${role}, status=${status})}"
                               class="btn btn-success btn-sm px-3">
                                <i class="bi bi-file-earmark-excel me-1"></i> Xuất Excel
                            </a>
                            <!-- Chỉ ADMIN mới được thêm nhân viên -->
                            <a sec:authorize="hasRole('ADMIN')" th:href="@{/nhan-vien/form}" class="btn btn-danger btn-sm px-3">
                                <i class="bi bi-plus-circle me-1"></i> Thêm nhân viên
                            </a>
                            <!-- STAFF không được thêm nhân viên -->
                            <span sec:authorize="hasRole('STAFF')" class="btn btn-secondary btn-sm px-3 disabled">
                                <i class="bi bi-plus-circle me-1"></i> Thêm nhân viên
                            </span>
                        </div>
                    </div>

                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light text-uppercase fs-7">
                            <tr>
                                <th width="50" class="text-center">STT</th>
                                <th class="text-start">Mã NV</th>
                                <th class="text-start">Họ và tên</th>
                                <th class="text-start">SĐT / Email</th>
                                <th class="text-start">Chức vụ</th>
                                <th class="text-start">Địa chỉ</th>
                                <th class="text-start">Ngày vào làm</th>
                                <th class="text-start">Trạng thái</th>
                                <th width="150" class="text-center">Hành động</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="nv, stat : ${list}">
                                <td class="text-center" th:text="${stat.index + 1 + (currentPage * 10)}"></td>
                                <td class="fw-bold text-danger text-start" th:text="${nv.maNhanVien}"></td>
                                <td class="text-start">
                                    <div th:text="${nv.hoTen}" class="fw-semibold text-dark"></div>
                                    <small class="text-muted" th:text="${nv.gioiTinh ? 'Nam' : 'Nữ'}"></small>
                                </td>
                                <td class="text-start">
                                    <div th:text="${nv.soDienThoai}"></div>
                                    <small class="text-muted" th:text="${nv.email}"></small>
                                </td>
                                <td class="text-start"><span class="badge bg-secondary-subtle text-secondary" th:text="${nv.chucVu}"></span></td>
                                <td class="text-start" th:text="${nv.diaChi != null && nv.diaChi != '' ? nv.diaChi : 'Chưa cập nhật'}"></td>
                                <td class="text-muted small text-start" th:text="${#temporals.format(nv.ngayVaoLam, 'dd/MM/yyyy HH:mm')}"></td>
                                <td class="text-start">
                                    <span th:if="${nv.trangThai}" class="badge bg-success-subtle text-success">
                                        <i class="bi bi-check-circle-fill me-1"></i>Đang làm việc
                                    </span>
                                    <span th:if="${!nv.trangThai}" class="badge bg-danger-subtle text-danger">
                                        <i class="bi bi-x-circle-fill me-1"></i>Nghỉ việc
                                    </span>
                                </td>
                                <td class="text-center action-column">
                                    <div class="action-container">
                                        <!-- Chỉ ADMIN mới được sửa -->
                                        <a sec:authorize="hasRole('ADMIN')" th:href="@{/nhan-vien/edit/{id}(id=${nv.maNhanVien})}"
                                           class="btn btn-outline-danger btn-sm">
                                            <i class="bi bi-pencil-square"></i>
                                        </a>
                                        <!-- STAFF không được sửa -->
                                        <span sec:authorize="hasRole('STAFF')" class="btn btn-secondary btn-sm disabled">
                                            <i class="bi bi-pencil-square"></i>
                                        </span>

                                        <!-- Chỉ ADMIN mới được bật/tắt trạng thái -->
                                        <form sec:authorize="hasRole('ADMIN')" th:action="@{/nhan-vien/toggle-status/{id}(id=${nv.maNhanVien})}"
                                              method="get" class="m-0 d-inline">
                                            <input type="hidden" name="page" th:value="${currentPage}">
                                            <input type="hidden" name="keyword" th:value="${keyword}">
                                            <input type="hidden" name="role" th:value="${role}">
                                            <input type="hidden" name="status" th:value="${status}">
                                            <button type="submit"
                                                    title="Bật/Tắt trạng thái"
                                                    class="toggle-link">
                                                <i class="bi" th:classappend="${nv.trangThai} ? 'bi-toggle-on' : 'bi-toggle-off'"></i>
                                            </button>
                                        </form>
                                        <!-- STAFF không được bật/tắt trạng thái -->
                                        <span sec:authorize="hasRole('STAFF')" class="toggle-link disabled" title="Không có quyền">
                                            <i class="bi" th:classappend="${nv.trangThai} ? 'bi-toggle-on' : 'bi-toggle-off'" style="opacity:0.5;"></i>
                                        </span>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(list)}">
                                <td colspan="9" class="text-center text-muted py-4">
                                    <i class="bi bi-people" style="font-size: 2.5rem; display: block; margin-bottom: 8px;"></i>
                                    Chưa có dữ liệu nhân viên nào.
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- ===== PAGINATION ===== -->
                    <div class="table-footer" th:if="${totalPages > 0}">
                        <div class="info-text">
                            <i class="bi bi-database me-1"></i>
                            Tổng: <strong th:text="${totalItems}">0</strong> bản ghi
                            <span class="mx-1">|</span>
                            Trang <strong th:text="${currentPage + 1}">1</strong> / <strong th:text="${totalPages}">1</strong>
                        </div>

                        <nav aria-label="Page navigation">
                            <ul class="pagination-custom">
                                <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                                    <a class="page-link" th:href="@{/nhan-vien(page=0, keyword=${keyword}, role=${role}, status=${status})}">
                                        <i class="bi bi-chevron-double-left"></i>
                                    </a>
                                </li>
                                <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                                    <a class="page-link" th:href="@{/nhan-vien(page=${currentPage - 1}, keyword=${keyword}, role=${role}, status=${status})}">
                                        <i class="bi bi-chevron-left"></i>
                                    </a>
                                </li>
                                <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                                    th:if="${i >= 0 && i < totalPages && ((i >= currentPage - 2 && i <= currentPage + 2) || i == 0 || i == totalPages - 1)}"
                                    th:classappend="${currentPage == i} ? 'active' : ''">
                                    <span class="page-link" th:if="${i == 2 && currentPage > 3}" style="border: none; background: transparent; cursor: default;">...</span>
                                    <a class="page-link" th:unless="${i == 2 && currentPage > 3}"
                                       th:href="@{/nhan-vien(page=${i}, keyword=${keyword}, role=${role}, status=${status})}"
                                       th:text="${i + 1}">
                                    </a>
                                    <span class="page-link" th:if="${i == totalPages - 3 && currentPage < totalPages - 4}" style="border: none; background: transparent; cursor: default;">...</span>
                                </li>
                                <li class="page-item" th:classappend="${currentPage + 1 >= totalPages} ? 'disabled'">
                                    <a class="page-link" th:href="@{/nhan-vien(page=${currentPage + 1}, keyword=${keyword}, role=${role}, status=${status})}">
                                        <i class="bi bi-chevron-right"></i>
                                    </a>
                                </li>
                                <li class="page-item" th:classappend="${currentPage + 1 >= totalPages} ? 'disabled'">
                                    <a class="page-link" th:href="@{/nhan-vien(page=${totalPages - 1}, keyword=${keyword}, role=${role}, status=${status})}">
                                        <i class="bi bi-chevron-double-right"></i>
                                    </a>
                                </li>
                            </ul>
                        </nav>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    var hasShownToast = false;

    function showToast(message, type, title) {
        if (hasShownToast) {
            console.log('⚠️ Đã hiển thị toast, bỏ qua toast mới:', message);
            return;
        }

        var container = document.getElementById('toastContainer');
        if (!container) return;

        var icons = {
            error: 'bi bi-x-circle-fill text-danger',
            success: 'bi bi-check-circle-fill text-success',
            warning: 'bi bi-exclamation-triangle-fill text-warning',
            info: 'bi bi-info-circle-fill text-info'
        };

        var titles = {
            error: 'Lỗi!',
            success: 'Thành công!',
            warning: 'Cảnh báo!',
            info: 'Thông tin'
        };

        var toast = document.createElement('div');
        toast.className = 'toast-custom ' + type;
        toast.innerHTML = `
            <div class="toast-icon"><i class="${icons[type] || icons.success}"></i></div>
            <div class="toast-content">
                <div class="toast-title">${title || titles[type] || 'Thông báo'}</div>
                <div class="toast-message">${message}</div>
            </div>
            <button class="toast-close" onclick="this.closest('.toast-custom').remove()">
                <i class="bi bi-x"></i>
            </button>
        `;
        container.appendChild(toast);

        hasShownToast = true;

        setTimeout(function() {
            if (toast.parentNode) {
                toast.style.animation = 'slideOutRight 0.3s ease forwards';
                setTimeout(function() { toast.remove(); }, 300);
            }
        }, 5000);
    }

    // =============================================
    // DOM READY
    // =============================================
    document.addEventListener("DOMContentLoaded", function () {
        var sessionMessage = sessionStorage.getItem('toastMessage');
        var sessionType = sessionStorage.getItem('toastType');
        if (sessionMessage && sessionMessage !== '' && sessionMessage !== 'null') {
            showToast(sessionMessage, sessionType || 'success');
            sessionStorage.removeItem('toastMessage');
            sessionStorage.removeItem('toastType');
        }

        var successMsg = document.querySelector('meta[name="successMess"]')?.getAttribute('content') || '';
        var errorMsg = document.querySelector('meta[name="errorMess"]')?.getAttribute('content') || '';

        console.log('🔍 successMess từ meta:', successMsg);
        console.log('🔍 errorMess từ meta:', errorMsg);

        if (!hasShownToast) {
            if (successMsg && successMsg !== '' && successMsg !== 'null' && successMsg !== 'undefined') {
                showToast(successMsg, 'success');
            }
            if (!hasShownToast && errorMsg && errorMsg !== '' && errorMsg !== 'null' && errorMsg !== 'undefined') {
                showToast(errorMsg, 'error');
            }
        }
    });

    // =============================================
    // SEARCH SUGGESTIONS - NHÂN VIÊN
    // =============================================
    document.addEventListener('DOMContentLoaded', function() {
        const searchInput = document.getElementById('searchInput');
        const suggestionsDropdown = document.getElementById('suggestionsDropdown');
        const suggestionsList = document.getElementById('suggestionsList');
        const loadingEl = document.querySelector('.suggestion-loading');

        if (!searchInput || !suggestionsDropdown || !suggestionsList) {
            console.error('❌ Không tìm thấy element cần thiết!');
            return;
        }

        let debounceTimer = null;
        let currentRequest = null;

        function updateDropdownPosition() {
            const rect = searchInput.getBoundingClientRect();
            const dropdownWidth = Math.min(rect.width, 450);
            suggestionsDropdown.style.left = rect.left + 'px';
            suggestionsDropdown.style.top = (rect.bottom + 4) + 'px';
            suggestionsDropdown.style.width = dropdownWidth + 'px';
            suggestionsDropdown.style.minWidth = Math.min(rect.width, 350) + 'px';
            suggestionsDropdown.style.maxWidth = '450px';
        }

        function highlightText(text, keyword) {
            if (!keyword || !text) return text;
            const regex = new RegExp('(' + keyword.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
            return text.replace(regex, '<span class="highlight">$1</span>');
        }

        function showSuggestions(data, keyword) {
            suggestionsList.innerHTML = '';

            if (!data || data.length === 0) {
                suggestionsList.innerHTML = `
                <div class="suggestion-empty">
                    <i class="bi bi-search me-1"></i>
                    Không tìm thấy nhân viên nào cho "<strong>${keyword}</strong>"
                </div>
            `;
                suggestionsDropdown.classList.add('show');
                updateDropdownPosition();
                return;
            }

            const maxDisplay = 10;
            const displayData = data.slice(0, maxDisplay);

            displayData.forEach((item) => {
                const div = document.createElement('div');
                div.className = 'suggestion-item';

                const highlightedName = highlightText(item.hoTen, keyword);
                const highlightedCode = highlightText(item.maNhanVien, keyword);

                div.innerHTML = `
                <span class="suggestion-code">${highlightedCode}</span>
                <div class="suggestion-info">
                    <div class="suggestion-name">${highlightedName}</div>
                    <div class="suggestion-detail">
                        <span><i class="bi bi-telephone me-1"></i>${item.soDienThoai || 'Chưa có'}</span>
                        <span class="badge bg-secondary-subtle text-secondary">${item.chucVu || 'Nhân viên'}</span>
                        <span><i class="bi bi-envelope me-1"></i>${item.email || ''}</span>
                    </div>
                </div>
            `;

                div.addEventListener('click', function() {
                    searchInput.value = item.hoTen;
                    suggestionsDropdown.classList.remove('show');

                    // Submit form tìm kiếm
                    var form = searchInput.closest('form');
                    if (form) {
                        form.submit();
                    } else {
                        // Fallback: redirect với keyword
                        var url = new URL(window.location.href);
                        url.searchParams.set('keyword', item.hoTen);
                        url.searchParams.set('page', '0');
                        window.location.href = url.toString();
                    }
                });

                div.addEventListener('mousedown', function(e) {
                    e.preventDefault();
                });

                suggestionsList.appendChild(div);
            });

            const totalItems = data.length;
            const countDiv = document.createElement('div');
            countDiv.className = 'suggestion-item';
            countDiv.style.background = '#f8f9fa';
            countDiv.style.justifyContent = 'center';
            countDiv.style.color = '#6b7280';
            countDiv.style.fontSize = '0.8rem';
            countDiv.style.cursor = 'default';
            countDiv.style.borderBottom = 'none';
            countDiv.style.fontWeight = '500';
            countDiv.style.padding = '6px 18px';

            if (totalItems > maxDisplay) {
                countDiv.innerHTML = `
                <i class="bi bi-list-ul me-1"></i>
                Hiển thị <strong>${maxDisplay}</strong> / <strong>${totalItems}</strong> nhân viên
            `;
            } else {
                countDiv.innerHTML = `
                <i class="bi bi-list-ul me-1"></i>
                Tìm thấy <strong>${totalItems}</strong> nhân viên
            `;
            }
            suggestionsList.appendChild(countDiv);

            suggestionsDropdown.classList.add('show');
            updateDropdownPosition();
            suggestionsDropdown.scrollTop = 0;
        }

        function fetchSuggestions(keyword) {
            if (!keyword || keyword.trim().length < 1) {
                suggestionsDropdown.classList.remove('show');
                return;
            }

            loadingEl.style.display = 'block';
            suggestionsList.innerHTML = '';
            suggestionsDropdown.classList.add('show');
            updateDropdownPosition();

            if (currentRequest) {
                currentRequest.abort();
            }

            var csrfToken = document.querySelector('meta[name="_csrf"]');
            var csrfHeader = document.querySelector('meta[name="_csrf_header"]');
            var token = csrfToken ? csrfToken.getAttribute('content') : '';
            var header = csrfHeader ? csrfHeader.getAttribute('content') : 'X-CSRF-TOKEN';

            const url = `/nhan-vien/api/search-suggestions?q=${encodeURIComponent(keyword.trim())}`;
            currentRequest = new XMLHttpRequest();
            currentRequest.open('GET', url, true);
            currentRequest.setRequestHeader('Content-Type', 'application/json');
            if (token) {
                currentRequest.setRequestHeader(header, token);
            }

            currentRequest.onload = function() {
                loadingEl.style.display = 'none';
                if (currentRequest.status === 200) {
                    try {
                        showSuggestions(JSON.parse(currentRequest.responseText), keyword.trim());
                    }
                    catch (e) {
                        console.error('❌ Parse error:', e);
                    }
                } else {
                    suggestionsDropdown.classList.remove('show');
                }
                currentRequest = null;
            };

            currentRequest.onerror = function() {
                loadingEl.style.display = 'none';
                suggestionsDropdown.classList.remove('show');
                currentRequest = null;
            };

            currentRequest.send();
        }

        // ===== EVENT LISTENERS =====
        searchInput.addEventListener('input', function() {
            const keyword = this.value;
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(function() {
                fetchSuggestions(keyword);
            }, 300);
        });

        searchInput.addEventListener('focus', function() {
            if (this.value && this.value.trim().length >= 1) {
                fetchSuggestions(this.value);
            }
        });

        searchInput.addEventListener('blur', function() {
            setTimeout(function() {
                suggestionsDropdown.classList.remove('show');
            }, 300);
        });

        searchInput.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
                e.preventDefault();
                const items = suggestionsList.querySelectorAll('.suggestion-item');
                if (items.length === 0) return;
                let currentIndex = -1;
                items.forEach((item, index) => {
                    if (item.classList.contains('active')) {
                        currentIndex = index;
                        item.classList.remove('active');
                    }
                });
                if (e.key === 'ArrowDown') {
                    currentIndex = (currentIndex + 1) % items.length;
                }
                else {
                    currentIndex = (currentIndex - 1 + items.length) % items.length;
                }
                items[currentIndex].classList.add('active');
                items[currentIndex].scrollIntoView({ block: 'nearest' });
                return;
            }

            if (e.key === 'Enter') {
                e.preventDefault();
                const activeItem = suggestionsList.querySelector('.suggestion-item.active');
                if (activeItem) {
                    activeItem.click();
                    return;
                }
                suggestionsDropdown.classList.remove('show');
                var form = searchInput.closest('form');
                if (form) {
                    form.submit();
                }
            }

            if (e.key === 'Escape') {
                suggestionsDropdown.classList.remove('show');
            }
        });

        document.addEventListener('click', function(e) {
            if (!e.target.closest('.search-wrapper')) {
                suggestionsDropdown.classList.remove('show');
            }
        });

        // Cập nhật vị trí dropdown khi resize/scroll
        window.addEventListener('resize', function() {
            if (suggestionsDropdown.classList.contains('show')) {
                updateDropdownPosition();
            }
        });

        window.addEventListener('scroll', function() {
            if (suggestionsDropdown.classList.contains('show')) {
                updateDropdownPosition();
            }
        });
    });
</script>

</body>
</html>
