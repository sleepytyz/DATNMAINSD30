<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Đổi mật khẩu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .profile-card { background:#fff; border:1px solid #E5E7EB; border-radius:10px; padding:24px; max-width:480px; }
        .profile-tabs a { padding:8px 16px; border-radius:8px; text-decoration:none; color:#374151; font-weight:600; font-size:14px; margin-right:8px; }
        .profile-tabs a.active { background:#E53935; color:#fff; }
        .field { margin-bottom: 16px; }
        .field label { display:block; font-weight:600; font-size:13.5px; margin-bottom:6px; }
        .field input { width:100%; padding:9px 12px; border:1px solid #D1D5DB; border-radius:8px; font-size:14px; }
        .field-error { color:#E53935; font-size:12.5px; margin-top:4px; }
    </style>
</head>
<body>
<div class="wrapper">
    <div sec:authorize="hasRole('STAFF')" th:replace="~{fragments/sidebarstaff :: sidebar-staff}"></div>
    <div sec:authorize="hasRole('ADMIN')" th:replace="~{fragments/sidebaradmin :: sidebar-admin}"></div>

    <div class="content-wrapper">
        <div th:replace="~{fragments/header :: header('Đổi mật khẩu', 'Tài khoản của tôi')}"></div>

        <div class="content-body">
            <div class="page-title" style="font-size:22px;font-weight:700;">Đổi mật khẩu</div>
            <div class="page-sub" style="font-size:13px;color:#6B7280;margin-bottom:18px;">
                Đặt mật khẩu mới cho tài khoản đăng nhập của bạn
            </div>

            <div class="profile-tabs" style="margin-bottom:18px;">
                <a href="/nv-ca-nhan"><i class="bi bi-person"></i> Hồ sơ</a>
                <a href="/nv-ca-nhan/doi-mat-khau" class="active"><i class="bi bi-shield-lock"></i> Đổi mật khẩu</a>
            </div>

            <div class="alert alert-danger" th:if="${loiMatKhauCu}" th:text="${loiMatKhauCu}"></div>

            <div class="profile-card">
                <form th:action="@{/nv-ca-nhan/doi-mat-khau}" th:object="${doiMatKhau}" method="post">
                    <div class="field">
                        <label>Mật khẩu hiện tại</label>
                        <input type="password" th:field="*{matKhauCu}">
                        <div class="field-error" th:if="${#fields.hasErrors('matKhauCu')}" th:errors="*{matKhauCu}"></div>
                    </div>
                    <div class="field">
                        <label>Mật khẩu mới</label>
                        <input type="password" th:field="*{matKhauMoi}">
                        <div class="field-error" th:if="${#fields.hasErrors('matKhauMoi')}" th:errors="*{matKhauMoi}"></div>
                    </div>
                    <div class="field">
                        <label>Xác nhận mật khẩu mới</label>
                        <input type="password" th:field="*{xnMatKhauMoi}">
                        <div class="field-error" th:if="${#fields.hasErrors('xnMatKhauMoi')}" th:errors="*{xnMatKhauMoi}"></div>
                    </div>
                    <button type="submit" class="btn btn-danger"><i class="bi bi-save"></i> Cập nhật mật khẩu</button>
                </form>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
