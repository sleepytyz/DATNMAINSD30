<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Quản lý đánh giá - FS Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .dg-card { background:#fff; border:1px solid #e9ecf2; border-radius:14px; }
        .dg-row { padding:16px 18px; border-bottom:1px solid #f2f4f7; }
        .dg-row:last-child { border-bottom:0; }
        .dg-row.an { opacity:.55; background:#fcfcfd; }
        .dg-ava { width:44px; height:44px; border-radius:999px; background:linear-gradient(135deg,#f59e0b,#fbbf24);
            color:#fff; display:grid; place-items:center; font-weight:800; flex-shrink:0; }
        .dg-noidung { background:#f8f9fb; border:1px solid #eef0f4; border-radius:11px; padding:11px 14px;
            margin-top:9px; white-space:pre-wrap; font-size:14px; }
        .dg-stat { background:#fff; border:1px solid #e9ecf2; border-radius:14px; padding:16px 18px; }
        .dg-stat .so { font-size:26px; font-weight:800; line-height:1; }
        .dg-stat .nhan { font-size:12.5px; color:#667085; margin-top:5px; }
        .dg-sao { color:#f59e0b; letter-spacing:1px; }
        .dg-sp { font-size:12.5px; color:#667085; }
    </style>
</head>
<body>
<div class="wrapper">
    <div sec:authorize="hasRole('ADMIN')"><div th:replace="~{fragments/sidebaradmin :: sidebar-admin}"></div></div>
    <div sec:authorize="hasRole('STAFF')"><div th:replace="~{fragments/sidebarstaff :: sidebar-staff}"></div></div>

    <div class="content-body px-3">
        <div th:replace="~{fragments/header :: header('Quản lý đánh giá', 'Đánh giá')}"></div>

        <div class="alert alert-success position-fixed shadow" th:if="${thongBao}"
             style="top:20px;right:20px;z-index:9999" th:text="${thongBao}"></div>

        <!-- ===== Thống kê nhanh ===== -->
        <div class="row g-3 mt-1">
            <div class="col-6 col-lg-3"><div class="dg-stat">
                <div class="so" th:text="${tongTatCa}">0</div>
                <div class="nhan"><i class="bi bi-chat-square-text me-1"></i>Tổng đánh giá</div>
            </div></div>
            <div class="col-6 col-lg-3"><div class="dg-stat">
                <div class="so text-success" th:text="${tongHien}">0</div>
                <div class="nhan"><i class="bi bi-eye me-1"></i>Đang hiển thị</div>
            </div></div>
            <div class="col-6 col-lg-3"><div class="dg-stat">
                <div class="so text-secondary" th:text="${tongAn}">0</div>
                <div class="nhan"><i class="bi bi-eye-slash me-1"></i>Đã ẩn</div>
            </div></div>
            <div class="col-6 col-lg-3"><div class="dg-stat">
                <div class="so" style="color:#f59e0b" th:text="${diemTB}">0</div>
                <div class="nhan"><i class="bi bi-star-fill me-1"></i>Điểm trung bình</div>
            </div></div>
        </div>

        <!-- ===== Bộ lọc ===== -->
        <div class="dg-card mt-3 p-3">
            <form method="get" th:action="@{/danhgia/index}" class="row g-2 align-items-end">
                <div class="col-lg-4 col-md-6">
                    <label class="form-label mb-1 small text-muted">Sản phẩm</label>
                    <select name="sp" class="form-select form-select-sm">
                        <option value="">— Tất cả sản phẩm —</option>
                        <option th:each="s : ${dsSanPham}"
                                th:value="${s.maSanPham}"
                                th:text="${s.tenSanPham}"
                                th:selected="${fSp != null and fSp == s.maSanPham}"></option>
                    </select>
                </div>
                <div class="col-lg-2 col-md-3 col-6">
                    <label class="form-label mb-1 small text-muted">Số sao</label>
                    <select name="sao" class="form-select form-select-sm">
                        <option value="">— Tất cả —</option>
                        <option th:each="i : ${#numbers.sequence(5,1)}"
                                th:value="${i}" th:text="${i} + ' sao'"
                                th:selected="${fSao != null and fSao == i}"></option>
                    </select>
                </div>
                <div class="col-lg-2 col-md-3 col-6">
                    <label class="form-label mb-1 small text-muted">Trạng thái</label>
                    <select name="tt" class="form-select form-select-sm">
                        <option value="">— Tất cả —</option>
                        <option value="hien" th:selected="${fTt == 'hien'}">Đang hiện</option>
                        <option value="an" th:selected="${fTt == 'an'}">Đã ẩn</option>
                    </select>
                </div>
                <div class="col-lg-3 col-md-8">
                    <label class="form-label mb-1 small text-muted">Tìm nội dung / tên khách</label>
                    <input type="text" name="q" class="form-control form-control-sm"
                           th:value="${fQ}" placeholder="Nhập từ khoá...">
                </div>
                <div class="col-lg-1 col-md-4 d-grid">
                    <button type="submit" class="btn btn-sm btn-primary">
                        <i class="bi bi-search"></i> Lọc</button>
                </div>
            </form>
        </div>

        <!-- ===== Danh sách đánh giá ===== -->
        <div class="dg-card mt-3 mb-4">
            <div class="p-3 border-bottom d-flex justify-content-between align-items-center">
                <b><i class="bi bi-star-half me-1"></i> Danh sách đánh giá</b>
                <span class="badge bg-light text-dark" th:text="${#lists.size(dsDanhGia)} + ' kết quả'">0</span>
            </div>

            <div th:if="${#lists.isEmpty(dsDanhGia)}" class="p-5 text-center text-muted">
                <i class="bi bi-inbox fs-1 d-block mb-2"></i>
                Không có đánh giá nào khớp bộ lọc.
            </div>

            <div th:each="d : ${dsDanhGia}" class="dg-row d-flex gap-3"
                 th:classappend="${d.trangThai} ? '' : 'an'">
                <div class="dg-ava"
                     th:text="${d.khachHang != null and d.khachHang.hoTen != null and !#strings.isEmpty(d.khachHang.hoTen)}
                              ? ${#strings.toUpperCase(#strings.substring(d.khachHang.hoTen,0,1))} : '?'">K</div>

                <div class="flex-grow-1">
                    <div class="d-flex justify-content-between align-items-start flex-wrap gap-2">
                        <div>
                            <b th:text="${d.khachHang != null} ? ${d.khachHang.hoTen} : 'Khách vãng lai'">Khách hàng</b>
                            <span class="dg-sao ms-2">
                                <span th:each="i : ${#numbers.sequence(1,5)}"
                                      th:text="${d.soSao != null and i le d.soSao} ? '★' : '☆'">★</span>
                            </span>
                            <span class="badge bg-secondary ms-1" th:unless="${d.trangThai}">Đã ẩn</span>
                            <div class="dg-sp mt-1">
                                <i class="bi bi-box-seam me-1"></i>
                                <span th:text="${d.sanPham != null} ? ${d.sanPham.tenSanPham} : '(sản phẩm đã xoá)'">Sản phẩm</span>
                                <span class="ms-2" th:if="${d.ngayDanhGia != null}">
                                    <i class="bi bi-clock ms-1 me-1"></i>
                                    <span th:text="${#temporals.format(d.ngayDanhGia, 'HH:mm dd/MM/yyyy')}"></span>
                                </span>
                            </div>
                        </div>

                        <div class="d-flex gap-2">
                            <a th:if="${d.trangThai}"
                               th:href="@{/danhgia/doi(id=${d.maDanhGia}, hien=false)}"
                               class="btn btn-sm btn-outline-secondary"
                               onclick="return confirm('Ẩn đánh giá này khỏi website?')">
                                <i class="bi bi-eye-slash"></i> Ẩn</a>
                            <a th:unless="${d.trangThai}"
                               th:href="@{/danhgia/doi(id=${d.maDanhGia}, hien=true)}"
                               class="btn btn-sm btn-outline-success">
                                <i class="bi bi-eye"></i> Hiện lại</a>
                        </div>
                    </div>

                    <div class="dg-noidung" th:if="${d.noiDung != null and !#strings.isEmpty(d.noiDung)}"
                         th:text="${d.noiDung}">Nội dung đánh giá</div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Tự ẩn thông báo sau 3 giây
    setTimeout(function () {
        document.querySelectorAll('.alert.position-fixed').forEach(function (e) { e.remove(); });
    }, 3000);
</script>
</body>
</html>
