<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Lịch của tôi – FS Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .page-title { font-size: 22px; font-weight: 700; }
        .page-sub   { font-size: 13px; color: #6B7280; margin-top: 2px; margin-bottom: 20px; }

        .card-box {
            background: #fff; border: 1px solid #E5E7EB; border-radius: 12px;
            padding: 22px; box-shadow: 0 1px 3px rgba(0,0,0,.05); margin-bottom: 20px;
        }
        .filter-row { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; }
        .filter-row label { font-size: 12.5px; color: #6B7280; display: block; margin-bottom: 5px; font-weight: 600; }
        .filter-row input {
            padding: 9px 12px; border: 1px solid #D1D5DB; border-radius: 8px; font-size: 14px;
        }
        .btn-filter {
            padding: 9px 20px; background: #2563EB; color: #fff; border: none;
            border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer;
        }
        .btn-reset {
            padding: 9px 18px; background: #fff; color: #4B5563; border: 1px solid #D1D5DB;
            border-radius: 8px; font-weight: 600; font-size: 14px; text-decoration: none;
            display: inline-block;
        }

        .tb { width: 100%; font-size: 13.5px; }
        .tb th {
            text-align: left; padding: 12px 10px;
            background: #c92327; color: #fff; font-weight: 700; font-size: 11.5px; text-transform: uppercase;
            white-space: nowrap;
        }
        .tb td { padding: 14px 10px; border-bottom: 1px solid #F9FAFB; }

        .ca-chip {
            background: #EFF6FF; color: #1E40AF; padding: 5px 12px;
            border-radius: 7px; font-size: 12.5px; font-weight: 600; white-space: nowrap;
        }
        .gio { font-family: monospace; font-size: 13px; color: #374151; }

        .tt {
            padding: 5px 14px; border-radius: 20px; font-size: 12px;
            font-weight: 700; white-space: nowrap; display: inline-block;
        }
        .tt-dang    { background: #8B5E3C; color: #fff; }
        .tt-daqua   { background: #FEE2E2; color: #991B1B; }
        .tt-sap     { background: #DBEAFE; color: #1E40AF; }
        .tt-dunggio { background: #DCFCE7; color: #166534; }
        .tt-muon    { background: #FEF3C7; color: #92400E; }
        .tt-vang    { background: #FEE2E2; color: #991B1B; }

        .empty { text-align: center; padding: 44px; color: #9CA3AF; }
    </style>
</head>
<body>
<div class="wrapper">
    <div sec:authorize="hasRole('STAFF')" th:replace="~{fragments/sidebarstaff :: sidebar-staff}"></div>
    <div sec:authorize="hasRole('ADMIN')" th:replace="~{fragments/sidebaradmin :: sidebar-admin}"></div>

    <div class="content-body">
        <div th:replace="~{fragments/header :: header('Lịch của tôi', 'Lịch làm việc')}"></div>

        <div class="content-wrapper" style="padding: 24px 28px;">
            <div class="page-title">LỊCH LÀM VIỆC CỦA TÔI</div>
            <div class="page-sub">Các ca bạn được phân công và trạng thái chấm công.</div>

            <div th:if="${loi != null}"
                 style="background:#FEE2E2;color:#991B1B;padding:14px;border-radius:9px;margin-bottom:18px;">
                <i class="bi bi-exclamation-triangle-fill"></i> <span th:text="${loi}"></span>
            </div>

            <!-- Bộ lọc -->
            <div class="card-box">
                <form method="get" action="/giao-ca/lich-cua-toi" class="filter-row">
                    <div>
                        <label>Từ ngày</label>
                        <input type="date" name="tuNgay" th:value="${tuNgay}">
                    </div>
                    <div>
                        <label>Đến ngày</label>
                        <input type="date" name="denNgay" th:value="${denNgay}">
                    </div>
                    <button type="submit" class="btn-filter">
                        <i class="bi bi-search"></i> Lọc
                    </button>
                    <a href="/giao-ca/lich-cua-toi" class="btn-reset">
                        <i class="bi bi-arrow-counterclockwise"></i> Xoá bộ lọc
                    </a>
                </form>
            </div>

            <!-- Bảng lịch -->
            <div class="card-box">
                <div th:if="${danhSachLich == null or danhSachLich.isEmpty()}" class="empty">
                    <i class="bi bi-calendar-x" style="font-size:34px;"></i>
                    <div style="margin-top:10px;">Bạn chưa có ca làm việc nào trong khoảng này.</div>
                </div>

                <div th:unless="${danhSachLich == null or danhSachLich.isEmpty()}" style="overflow-x:auto;">
                    <table class="tb">
                        <thead>
                        <tr>
                            <th>STT</th>
                            <th>Ngày</th>
                            <th>Ca làm việc</th>
                            <th>Giờ quy định</th>
                            <th>Chấm công thực tế</th>
                            <th>Trạng thái</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="cc, iter : ${danhSachLich}">
                            <td th:text="${iter.count}">1</td>
                            <td style="font-weight:600;"
                                th:text="${#temporals.format(cc.ngayChamCong, 'dd/MM/yyyy')}"></td>
                            <td>
                                <span class="ca-chip"
                                      th:text="${cc.caLamViec != null ? cc.caLamViec.tenCa : '-'}"></span>
                            </td>
                            <td class="gio" th:if="${cc.caLamViec != null}"
                                th:text="${cc.caLamViec.gioBatDau} + ' - ' + ${cc.caLamViec.gioKetThuc}"></td>
                            <td class="gio" th:if="${cc.caLamViec == null}">-</td>
                            <td class="gio">
                                <span th:if="${cc.gioVao != null}"
                                      th:text="${#temporals.format(cc.gioVao, 'HH:mm')}"></span>
                                <span th:if="${cc.gioVao != null and cc.gioRa != null}"> → </span>
                                <span th:if="${cc.gioRa != null}"
                                      th:text="${#temporals.format(cc.gioRa, 'HH:mm')}"></span>
                                <span th:if="${cc.gioVao == null}" style="color:#D1D5DB;">--</span>
                            </td>
                            <td>
                                <!-- Đang làm: đã check-in, chưa check-out, và là hôm nay -->
                                <span th:if="${cc.gioVao != null and cc.gioRa == null}"
                                      class="tt tt-dang">Đang làm</span>

                                <!-- Đã xong -> hiện đúng giờ / muộn -->
                                <span th:if="${cc.gioVao != null and cc.gioRa != null
                                               and cc.trangThaiChamCong == 'DUNG_GIO'}"
                                      class="tt tt-dunggio">Đúng giờ</span>
                                <span th:if="${cc.gioVao != null and cc.gioRa != null
                                               and cc.trangThaiChamCong == 'DEN_MUON'}"
                                      class="tt tt-muon"
                                      th:text="'Muộn ' + ${cc.soPhutMuon} + 'p'"></span>

                                <!-- Chưa chấm công -->
                                <span th:if="${cc.gioVao == null and cc.trangThaiChamCong == 'VANG_MAT'}"
                                      class="tt tt-vang">Vắng mặt</span>
                                <span th:if="${cc.gioVao == null and cc.trangThaiChamCong == 'CHUA_DEN_GIO'}"
                                      class="tt tt-sap">Sắp tới</span>
                                <span th:if="${cc.gioVao == null and cc.trangThaiChamCong == 'CHUA_CHAM'}"
                                      class="tt tt-sap">Chưa chấm công</span>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>
</div>
</body>
</html>
