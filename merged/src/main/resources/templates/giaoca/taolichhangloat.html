<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <title>Tạo lịch hàng loạt – FS Shop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <meta name="_csrf" th:content="${_csrf.token}">
  <meta name="_csrf_header" th:content="${_csrf.headerName}">
  <style>
    .page-title { font-size:22px; font-weight:700; }
    .page-sub   { font-size:13px; color:#6B7280; margin-top:2px; margin-bottom:20px; }
    .week-nav { display:flex; align-items:center; gap:12px; }
    .week-nav-btn {
      width:34px; height:34px; border-radius:8px; border:1.5px solid #E5E7EB;
      display:flex; align-items:center; justify-content:center;
      color:#374151; text-decoration:none; font-size:14px;
      transition:all .15s;
    }
    .week-nav-btn:hover { border-color:#E53935; color:#E53935; }
    .week-label { font-size:14px; font-weight:700; color:#1A1A1A; }
    .schedule-card { background:#fff; border:1px solid #E5E7EB; border-radius:10px; overflow:hidden; }
    .schedule-card-header {
      padding:13px 18px; border-bottom:1px solid #E5E7EB;
      display:flex; align-items:center; justify-content:space-between;
      font-weight:700; font-size:14px;
    }
    .schedule-wrap { overflow-x:auto; }
    .schedule-table { width:100%; border-collapse:collapse; min-width:700px; }
    .schedule-table th {
      padding:10px 12px; background:#FAFAFA;
      border-bottom:2px solid #E5E7EB; text-align:center;
      font-size:12px; font-weight:600; color:#6B7280;
    }
    .schedule-table th:first-child { text-align:left; width:180px; }
    .schedule-table td {
      padding:10px 8px; border-bottom:1px solid #F3F4F6;
      border-right:1px solid #F3F4F6; text-align:center; vertical-align:middle;
    }
    .schedule-table td:first-child { padding:12px 14px; background:#FAFAFA; text-align:left; vertical-align:middle; border-right:2px solid #E5E7EB; }
    .nv-name { font-weight:600; font-size:13px; color:#1A1A1A; }
    .nv-code { font-size:11.5px; color:#9CA3AF; }
    .day-header-name { font-size:12px; font-weight:700; color:#1A1A1A; display:block; }
    .day-header-date { font-size:11px; color:#9CA3AF; }
    .col-today th { background:#FEF2F2 !important; }
    .cell-today { background:#FFFBFB !important; }
    .ca-select { width:100%; font-size:12px; border:1.5px solid #E5E7EB; border-radius:6px; padding:4px 8px; }
    .ca-select:focus { border-color:#E53935; outline:none; box-shadow:none; }
    .btn-save-lich {
      padding:9px 24px; border-radius:7px; background:#E53935;
      color:#fff; border:none; font-size:13px; font-weight:600; cursor:pointer;
    }
    .btn-save-lich:hover { background:#B71C1C; }
    .btn-save-lich:disabled { opacity:.6; cursor:not-allowed; }
    .toast-container-custom { position:fixed; top:20px; right:20px; z-index:9999; max-width:380px; }
    .toast-custom {
      background:#fff; border-radius:10px; padding:14px 18px;
      box-shadow:0 8px 30px rgba(0,0,0,.12); border-left:4px solid #059669;
      animation:slideIn .3s ease; margin-bottom:10px; display:flex; align-items:center; gap:10px;
    }
    .toast-custom.error { border-left-color:#E53935; }
    @keyframes slideIn { from{transform:translateX(100%);opacity:0} to{transform:translateX(0);opacity:1} }
  </style>
</head>
<body>
<div class="wrapper">

  <div sec:authorize="hasRole('ADMIN')">
    <div th:replace="fragments/sidebaradmin :: sidebar-admin"></div>
  </div>

  <div sec:authorize="hasRole('STAFF')">
    <div th:replace="fragments/sidebarstaff :: sidebar-staff"></div>
  </div>

  <div class="content-body">
    <div th:replace="~{fragments/header :: header('Tạo lịch làm việc', 'Ca làm việc')}"></div>

    <div class="p-3">
      <div class="d-flex align-items-start justify-content-between mb-3 flex-wrap gap-2">
        <div>
          <div class="page-title">Tạo lịch hàng loạt</div>
          <div class="page-sub">Phân ca cho nhân viên trong tuần</div>
        </div>
        <!-- Week nav -->
        <div class="week-nav">
          <a th:href="@{/giao-ca/tao-lich-hang-loat(tuan=${tuanHienTai - 1})}" class="week-nav-btn">
            <i class="bi bi-chevron-left"></i>
          </a>
          <span class="week-label"
                th:text="${#temporals.format(tuNgay,'dd/MM')} + ' – ' + ${#temporals.format(denNgay,'dd/MM/yyyy')}"></span>
          <a th:href="@{/giao-ca/tao-lich-hang-loat(tuan=${tuanHienTai + 1})}" class="week-nav-btn">
            <i class="bi bi-chevron-right"></i>
          </a>
          <a th:href="@{/giao-ca/tao-lich-hang-loat}" class="btn btn-sm btn-outline-secondary ms-2">
            <i class="bi bi-house"></i> Tuần này
          </a>
        </div>
      </div>

      <!-- Links -->
      <div class="d-flex gap-2 mb-3 flex-wrap">
        <a th:href="@{/giao-ca/ca-lam-viec}" class="btn btn-sm btn-outline-danger">
          <i class="bi bi-clock me-1"></i> Quản lý ca
        </a>
        <a th:href="@{/giao-ca/lich-nhan-vien}" class="btn btn-sm btn-outline-secondary">
          <i class="bi bi-calendar3 me-1"></i> Xem lịch
        </a>
      </div>

      <div class="schedule-card">
        <div class="schedule-card-header">
          <span><i class="bi bi-table me-2" style="color:#E53935"></i>Phân ca nhân viên</span>
          <button class="btn-save-lich" id="btnSaveLich" onclick="saveLich()">
            <i class="bi bi-save me-1"></i> Lưu lịch
          </button>
        </div>
        <div class="schedule-wrap">
          <table class="schedule-table" id="lichTable">
            <thead>
            <tr>
              <th>Nhân viên</th>
              <th th:each="ngay, stat : ${listNgay}"
                  th:classappend="${ngay == today} ? 'col-today'">
                                <span class="day-header-name"
                                      th:text="${{'Thứ 2','Thứ 3','Thứ 4','Thứ 5','Thứ 6','Thứ 7','CN'}[ngay.dayOfWeek.value - 1]}"></span>
                <span class="day-header-date" th:text="${#temporals.format(ngay,'dd/MM')}"></span>
              </th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="nv : ${listNhanVien}">
              <td>
                <div class="nv-name" th:text="${nv.hoTen}">Nhân viên</div>
                <div class="nv-code" th:text="${nv.maNhanVien}">NV001</div>
              </td>
              <td th:each="ngay : ${listNgay}"
                  th:classappend="${ngay == today} ? 'cell-today'">
                <select class="ca-select"
                        th:name="${'ca_' + nv.maNhanVien + '_' + ngay}"
                        th:data-nv="${nv.maNhanVien}"
                        th:data-ngay="${ngay}">
                  <option value="">-- Không --</option>
                  <option th:each="ca : ${listCa}"
                          th:value="${ca.maCa}"
                          th:text="${ca.tenCa + ' (' + ca.gioBatDau + '-' + ca.gioKetThuc + ')'}"></option>
                </select>
              </td>
            </tr>
            <tr th:if="${listNhanVien == null or listNhanVien.isEmpty()}">
              <td th:colspan="${listNgay.size() + 1}" class="text-center py-4 text-muted">
                <i class="bi bi-people me-2"></i> Không có nhân viên
              </td>
            </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast-container-custom" id="toastContainer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script th:inline="javascript">
  /*<![CDATA[*/
  const csrfToken  = document.querySelector('meta[name="_csrf"]')?.getAttribute('content') || '';
  const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.getAttribute('content') || 'X-CSRF-TOKEN';

  function showToast(msg, type) {
    const c = document.getElementById('toastContainer');
    const t = document.createElement('div');
    t.className = 'toast-custom' + (type === 'error' ? ' error' : '');
    t.innerHTML = `<i class="bi ${type==='error'?'bi-x-circle text-danger':'bi-check-circle text-success'}" style="font-size:18px"></i>
                   <span style="font-size:13px;font-weight:600">${msg}</span>`;
    c.appendChild(t);
    setTimeout(() => t.remove(), 3500);
  }

  function saveLich() {
    const btn = document.getElementById('btnSaveLich');
    btn.disabled = true;
    btn.innerHTML = '<i class="bi bi-hourglass-split me-1"></i> Đang lưu...';

    const selects = document.querySelectorAll('.ca-select');
    const danhSachNhanVien = [];

    selects.forEach(sel => {
      if (sel.value) {
        danhSachNhanVien.push({
          maNhanVien: sel.dataset.nv,
          ngay: sel.dataset.ngay,
          maCa: parseInt(sel.value)
        });
      }
    });

    if (danhSachNhanVien.length === 0) {
      showToast('Vui lòng chọn ít nhất 1 ca làm việc', 'error');
      btn.disabled = false;
      btn.innerHTML = '<i class="bi bi-save me-1"></i> Lưu lịch';
      return;
    }

    fetch('/giao-ca/tao-lich-hang-loat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', [csrfHeader]: csrfToken },
      body: JSON.stringify({ danhSachNhanVien })
    })
            .then(r => r.json())
            .then(res => {
              if (res.success) {
                showToast(res.message || 'Tạo lịch thành công!', 'success');
                setTimeout(() => location.href = '/giao-ca/lich-nhan-vien', 1200);
              } else {
                showToast(res.message || 'Có lỗi xảy ra', 'error');
              }
            })
            .catch(e => showToast('Lỗi kết nối: ' + e.message, 'error'))
            .finally(() => {
              btn.disabled = false;
              btn.innerHTML = '<i class="bi bi-save me-1"></i> Lưu lịch';
            });
  }
  /*]]>*/
</script>
</body>
</html>
