<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thêm Tài Khoản Hệ Thống</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #F4F6F9;
            font-family: 'Segoe UI', sans-serif;
            font-size: 14px;
            padding-top: 50px;
        }
        .form-card {
            background: #FFFFFF;
            border-radius: 16px;
            border: none;
            box-shadow: 0 8px 24px rgba(0,0,0,0.05);
            padding: 30px;
        }
        .form-title {
            font-size: 20px;
            font-weight: 700;
            color: #212121;
            border-bottom: 2px solid #F5F5F5;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }
        .form-label-custom {
            font-size: 12px;
            font-weight: 600;
            color: #616161;
            margin-bottom: 6px;
        }
        .form-control-custom, .form-select-custom {
            background-color: #FAFAFA;
            border: 1px solid #E0E0E0;
            border-radius: 8px;
            padding: 10px 12px;
        }
        .form-control-custom:focus, .form-select-custom:focus {
            background-color: #FFF;
            border-color: #D2232A;
            box-shadow: 0 0 0 3px rgba(210,35,42,0.1);
        }
        .btn-danger-custom {
            background-color: #D2232A;
            border-color: #D2232A;
            font-weight: 500;
            padding: 10px 24px;
            border-radius: 8px;
        }
        .btn-danger-custom:hover {
            background-color: #B01C22;
        }
        .btn-back {
            border-radius: 8px;
            padding: 10px 20px;
        }
    </style>
</head>
<body>

<div class="container" style="max-width: 900px;">
    <div class="form-card">
        <div class="form-title">
            <i class="bi bi-person-plus text-danger me-2"></i> THÊM TÀI KHOẢN MỚI
        </div>

        <form action="/tai-khoan/add" method="post">
            <div class="row g-4">
                <div class="col-md-6">
                    <div class="mb-3">
                        <label class="form-label-custom">MÃ TÀI KHOẢN</label>
                        <input type="text" class="form-control form-control-custom text-muted" value="Hệ thống tự sinh (TKxxx)" disabled readonly style="background-color: #EEEEEE;">
                    </div>

                    <div class="mb-3">
                        <label class="form-label-custom">MÃ NHÂN VIÊN</label>
                        <div class="input-group">
                            <input type="number" name="maNhanVien" class="form-control form-control-custom" placeholder="Nhập mã..." required>
                            <button class="btn btn-danger px-3" type="button" style="border-top-right-radius: 8px; border-bottom-right-radius: 8px; background-color: #D2232A;">Chọn</button>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label-custom">TÊN ĐĂNG NHẬP</label>
                        <input type="text" name="tenDangNhap" class="form-control form-control-custom" placeholder="Nhập tên đăng nhập..." required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label-custom">MẬT KHẨU</label>
                        <input type="text" name="matKhau" class="form-control form-control-custom" placeholder="Nhập mật khẩu..." required>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="mb-3">
                        <label class="form-label-custom">VAI TRÒ (ROLE)</label>
                        <select name="vaiTro" class="form-select form-select-custom" required>
                            <option>Bán hàng</option>
                            <option>Quản lý</option>
                            <option>Thu ngân</option>
                            <option>Nhân viên kho</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label-custom">TRẠNG THÁI</label>
                        <input type="text" class="form-control form-control-custom text-success fw-bold" value="Hoạt động" readonly disabled style="background-color: #FAFAFA;">
                    </div>

                    <div class="mb-3">
                        <label class="form-label-custom">EMAIL</label>
                        <input type="email" name="email" class="form-control form-control-custom" placeholder="example@gmail.com" required>
                    </div>

                    <div class="d-flex gap-2 justify-content-end mt-5">
                        <a href="/tai-khoan" class="btn btn-secondary btn-back">
                            <i class="bi bi-arrow-left"></i> Quay lại
                        </a>
                        <button type="submit" class="btn btn-danger btn-danger-custom">
                            <i class="bi bi-check-lg"></i> Thêm tài khoản
                        </button>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>

</body>
</html>
