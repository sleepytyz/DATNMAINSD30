<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quên mật khẩu - FS Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #F5F6FA;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .forgot-wrapper {
            width: 480px;
            max-width: 96vw;
            background: #fff;
            border-radius: 16px;
            padding: 40px 36px;
            box-shadow: 0 8px 40px rgba(0,0,0,.10);
        }

        .logo {
            text-align: center;
            margin-bottom: 28px;
        }
        .logo h1 {
            font-size: 24px;
            font-weight: 800;
            color: #E53935;
            margin-top: 12px;
        }

        h2 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 8px;
            text-align: center;
        }

        .sub {
            font-size: 13px;
            color: #6B7280;
            text-align: center;
            margin-bottom: 28px;
        }

        .alert {
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .alert-danger  { background: #FEF2F2; color: #991B1B; border: 1px solid #FECACA; }
        .alert-success { background: #ECFDF5; color: #065F46; border: 1px solid #6EE7B7; }
        .alert-warning { background: #FFFBEB; color: #92400E; border: 1px solid #FDE68A; }

        .field {
            margin-bottom: 22px;
        }
        .field label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 6px;
        }
        .input-wrap {
            position: relative;
        }
        .input-wrap i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 15px;
            color: #9CA3AF;
        }
        .input-wrap input {
            width: 100%;
            padding: 10px 12px 10px 38px;
            border: 1.5px solid #E5E7EB;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color .15s;
        }
        .input-wrap input:focus {
            border-color: #E53935;
        }

        .btn-submit {
            width: 100%;
            padding: 11px;
            background: #E53935;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: background .15s;
        }
        .btn-submit:hover {
            background: #B71C1C;
        }

        .back-link {
            text-align: center;
            margin-top: 24px;
            font-size: 13px;
        }
        .back-link a {
            color: #E53935;
            text-decoration: none;
            font-weight: 600;
        }
        .back-link a:hover {
            text-decoration: underline;
        }

        .otp-fields {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .otp-fields .input-wrap {
            flex: 1;
        }
        .otp-fields button {
            padding: 10px 16px;
            background: #4B5563;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }
        .otp-fields button:hover {
            background: #374151;
        }
    </style>
</head>
<body>

<div class="forgot-wrapper">
    <div class="logo">
        <div style="font-size: 48px;">👟</div>
        <h1>FS Shop</h1>
    </div>

    <!-- STEP 1: NHẬP EMAIL -->
    <div th:if="${step == null or step == 'email'}">
        <h2>Quên mật khẩu</h2>
        <p class="sub">Nhập email đăng ký để nhận mã OTP</p>

        <div th:if="${error}" class="alert alert-danger">
            <i class="bi bi-exclamation-circle-fill"></i>
            <span th:text="${error}"></span>
        </div>

        <form th:action="@{/forgot/send-otp}" method="post">
            <div class="field">
                <label for="email">Địa chỉ Email</label>
                <div class="input-wrap">
                    <i class="bi bi-envelope"></i>
                    <input type="email" id="email" name="email"
                           placeholder="example@email.com" required autofocus>
                </div>
            </div>
            <button type="submit" class="btn-submit">Gửi mã OTP</button>
        </form>

        <div class="back-link">
            <a href="/login">← Quay lại đăng nhập</a>
        </div>
    </div>

    <!-- STEP 2: NHẬP OTP -->
    <div th:if="${step == 'otp'}">
        <h2>Xác thực OTP</h2>
        <p class="sub">Mã xác thực đã được gửi đến email của bạn</p>

        <div th:if="${error}" class="alert alert-danger">
            <i class="bi bi-exclamation-circle-fill"></i>
            <span th:text="${error}"></span>
        </div>

        <form th:action="@{/forgot/verify-otp}" method="post">
            <div class="field">
                <label for="otp">Mã OTP (6 số)</label>
                <div class="input-wrap">
                    <i class="bi bi-shield-lock"></i>
                    <input type="text" id="otp" name="otp"
                           placeholder="Nhập mã 6 số" maxlength="6" required>
                </div>
            </div>
            <button type="submit" class="btn-submit">Xác thực</button>
        </form>

        <form th:action="@{/forgot/send-otp}" method="post" style="margin-top: 16px;">
            <input type="hidden" name="email" th:value="${session.resetEmail}">
            <button type="submit" style="background: #6B7280;" class="btn-submit">Gửi lại mã OTP</button>
        </form>

        <div class="back-link">
            <a href="/login">← Quay lại đăng nhập</a>
        </div>
    </div>

    <!-- STEP 3: ĐẶT LẠI MẬT KHẨU -->
    <div th:if="${step == 'reset'}">
        <h2>Đặt lại mật khẩu</h2>
        <p class="sub">Tạo mật khẩu mới cho tài khoản của bạn</p>

        <div th:if="${error}" class="alert alert-danger">
            <i class="bi bi-exclamation-circle-fill"></i>
            <span th:text="${error}"></span>
        </div>

        <form th:action="@{/forgot/reset}" method="post" id="resetForm">
            <div class="field">
                <label for="newPassword">Mật khẩu mới</label>
                <div class="input-wrap">
                    <i class="bi bi-lock"></i>
                    <input type="password" id="newPassword" name="newPassword"
                           placeholder="Nhập mật khẩu mới" required>
                </div>
            </div>
            <div class="field">
                <label for="confirmPassword">Xác nhận mật khẩu</label>
                <div class="input-wrap">
                    <i class="bi bi-lock-fill"></i>
                    <input type="password" id="confirmPassword" name="confirmPassword"
                           placeholder="Nhập lại mật khẩu mới" required>
                </div>
            </div>
            <button type="submit" class="btn-submit">Đặt lại mật khẩu</button>
        </form>

        <div class="back-link">
            <a href="/login">← Quay lại đăng nhập</a>
        </div>
    </div>
</div>

<script>
    document.getElementById('resetForm')?.addEventListener('submit', function(e) {
        const newPass = document.getElementById('newPassword').value;
        const confirmPass = document.getElementById('confirmPassword').value;
        if (newPass !== confirmPass) {
            e.preventDefault();
            alert('Mật khẩu xác nhận không khớp!');
        }
    });
</script>

</body>
</html>
