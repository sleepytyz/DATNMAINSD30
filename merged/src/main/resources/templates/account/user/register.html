<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký – FS Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #F5F6FA;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-wrapper {
            display: flex;
            width: 900px;
            max-width: 96vw;
            min-height: 520px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 40px rgba(0,0,0,.10);
        }

        /* ── LEFT BRAND PANEL ── */
        .brand-panel {
            flex: 1;
            background: #E53935;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 48px 36px;
            gap: 20px;
            color: #fff;
        }
        .brand-panel .logo-box {
            width: 90px; height: 90px; border-radius: 50%;
            background: #fff;
            display: flex; align-items: center; justify-content: center;
        }
        .brand-panel .logo-box img { width: 64px; }
        .brand-panel h1 { font-size: 28px; font-weight: 800; letter-spacing: .5px; }
        .brand-panel p  { font-size: 14px; opacity: .88; text-align: center; line-height: 1.6; }

        /* ── RIGHT FORM PANEL ── */
        .form-panel {
            width: 400px;
            background: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 48px 40px;
        }

        .form-panel h2 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
        .form-panel .sub { font-size: 13px; color: #6B7280; margin-bottom: 28px; }

        /* Alerts */
        .alert {
            padding: 10px 14px; border-radius: 8px;
            font-size: 13px; margin-bottom: 16px;
            display: flex; align-items: center; gap: 8px;
        }
        .alert-danger  { background: #FEF2F2; color: #991B1B; border: 1px solid #FECACA; }

        /* Fields */
        .field { margin-bottom: 18px; }
        .field label {
            display: block; font-size: 13px; font-weight: 600;
            color: #374151; margin-bottom: 6px;
        }
        .input-wrap { position: relative; }
        .input-wrap i {
            position: absolute; left: 12px; top: 50%;
            transform: translateY(-50%);
            font-size: 15px; color: #9CA3AF;
        }
        .input-wrap input {
            width: 100%; padding: 10px 12px 10px 38px;
            border: 1.5px solid #E5E7EB; border-radius: 8px;
            font-size: 14px; outline: none;
            transition: border-color .15s;
        }
        .input-wrap input:focus { border-color: #E53935; }
        .input-wrap input.is-invalid { border-color: #B71C1C; }
        .field-error { font-size: 11.5px; color: #B71C1C; margin-top: 4px; }

        /* Submit */
        .btn-login {
            width: 100%; padding: 11px;
            background: #E53935; color: #fff;
            border: none; border-radius: 8px;
            font-size: 15px; font-weight: 700; cursor: pointer;
            transition: background .15s;
            margin-top: 6px;
        }
        .btn-login:hover { background: #B71C1C; }

        /* Footer link */
        .form-footer {
            text-align: center; margin-top: 20px;
            font-size: 13px; color: #6B7280;
        }
        .form-footer a { color: #E53935; font-weight: 600; text-decoration: none; }
        .form-footer a:hover { text-decoration: underline; }

        @media (max-width: 640px) {
            .brand-panel { display: none; }
            .form-panel  { width: 100%; padding: 36px 24px; }
        }
    </style>
</head>
<body>

<div class="login-wrapper">

    <!-- Brand -->
    <div class="brand-panel">
        <div class="logo-box">
            <img th:src="@{/storefront/img/logo.jpg}" style="background:#fff;border-radius:12px;object-fit:cover" src="https://via.placeholder.com/64x64?text=FS" alt="FS Shop">
        </div>
        <h1>FS Shop</h1>
        <p>Tạo tài khoản để mua sắm,<br>theo dõi đơn hàng và nhận ưu đãi riêng</p>
    </div>

    <!-- Form -->
    <div class="form-panel">
        <h2>Đăng ký tài khoản</h2>
        <p class="sub">Chỉ mất vài giây để bắt đầu mua sắm.</p>

        <form th:action="@{/register}" th:object="${dangKy}" method="post">

            <div class="field">
                <label for="tenDangNhap">Tên đăng nhập</label>
                <div class="input-wrap">
                    <i class="bi bi-person"></i>
                    <input type="text" id="tenDangNhap" th:field="*{tenDangNhap}"
                           placeholder="Nhập tên đăng nhập" autofocus
                           th:classappend="${#fields.hasErrors('tenDangNhap')} ? 'is-invalid'">
                </div>
                <div class="field-error" th:if="${#fields.hasErrors('tenDangNhap')}" th:errors="*{tenDangNhap}"></div>
            </div>

            <div class="field">
                <label for="matKhau">Mật khẩu</label>
                <div class="input-wrap">
                    <i class="bi bi-lock"></i>
                    <input type="password" id="matKhau" th:field="*{matKhau}"
                           placeholder="Tối thiểu 6 ký tự"
                           th:classappend="${#fields.hasErrors('matKhau')} ? 'is-invalid'">
                </div>
                <div class="field-error" th:if="${#fields.hasErrors('matKhau')}" th:errors="*{matKhau}"></div>
            </div>

            <div class="field">
                <label for="xnMatKhau">Xác nhận mật khẩu</label>
                <div class="input-wrap">
                    <i class="bi bi-lock-fill"></i>
                    <input type="password" id="xnMatKhau" th:field="*{xnMatKhau}"
                           placeholder="Nhập lại mật khẩu"
                           th:classappend="${#fields.hasErrors('xnMatKhau')} ? 'is-invalid'">
                </div>
                <div class="field-error" th:if="${#fields.hasErrors('xnMatKhau')}" th:errors="*{xnMatKhau}"></div>
            </div>

            <button type="submit" class="btn-login">Đăng ký</button>

        </form>

        <div class="form-footer">
            Đã có tài khoản? <a href="/login">Đăng nhập ngay</a>
        </div>
    </div>

</div>
</body>
</html>
