<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Không có quyền – FS Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #F5F6FA;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .deny-card {
            background: #fff;
            border: 1px solid #E5E7EB;
            border-radius: 16px;
            padding: 56px 48px;
            text-align: center;
            max-width: 440px;
            width: 92vw;
            box-shadow: 0 4px 24px rgba(0,0,0,.07);
        }

        /* Icon vòng tròn */
        .icon-circle {
            width: 80px; height: 80px; border-radius: 50%;
            background: #FEF2F2;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 24px;
        }
        .icon-circle i { font-size: 36px; color: #E53935; }

        /* Mã lỗi nhỏ */
        .error-code {
            font-size: 12px; font-weight: 700; letter-spacing: .1em;
            color: #E53935; text-transform: uppercase; margin-bottom: 8px;
        }

        h1 {
            font-size: 22px; font-weight: 800;
            color: #1A1A1A; margin-bottom: 10px;
        }

        p {
            font-size: 14px; color: #6B7280; line-height: 1.65; margin-bottom: 28px;
        }

        /* Buttons */
        .btn-group { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

        .btn-primary-red {
            padding: 10px 24px; border-radius: 8px;
            background: #E53935; color: #fff; border: none;
            font-size: 14px; font-weight: 700; cursor: pointer;
            text-decoration: none; transition: background .15s;
            display: inline-flex; align-items: center; gap: 6px;
        }
        .btn-primary-red:hover { background: #B71C1C; }

        .btn-outline {
            padding: 10px 24px; border-radius: 8px;
            background: #fff; color: #374151;
            border: 1.5px solid #E5E7EB;
            font-size: 14px; font-weight: 600; cursor: pointer;
            text-decoration: none; transition: border-color .15s;
            display: inline-flex; align-items: center; gap: 6px;
        }
        .btn-outline:hover { border-color: #9CA3AF; }

        /* Divider */
        .divider {
            border: none; border-top: 1px solid #E5E7EB;
            margin: 28px 0 20px;
        }

        .contact-hint {
            font-size: 12.5px; color: #9CA3AF;
        }
        .contact-hint a { color: #E53935; text-decoration: none; font-weight: 500; }
        .contact-hint a:hover { text-decoration: underline; }

        /* Logo nhỏ trên cùng */
        .logo-top {
            display: flex; align-items: center; justify-content: center;
            gap: 8px; margin-bottom: 32px;
        }
        .logo-top .dot {
            width: 32px; height: 32px; border-radius: 50%;
            background: #E53935;
            display: flex; align-items: center; justify-content: center;
        }
        .logo-top .dot i { font-size: 16px; color: #fff; }
        .logo-top span { font-size: 16px; font-weight: 800; color: #1A1A1A; }
    </style>
</head>
<body>

<div class="deny-card">

    <!-- Logo -->
    <div class="logo-top">
        <div class="dot"><i class="bi bi-shop"></i></div>
        <span>FS Shop</span>
    </div>

    <!-- Icon -->
    <div class="icon-circle">
        <i class="bi bi-shield-x"></i>
    </div>

    <div class="error-code">Lỗi 403 – Truy cập bị từ chối</div>

    <h1>Bạn không có quyền truy cập</h1>

    <p>
        Tài khoản của bạn không có quyền xem trang này.<br>
        Vui lòng liên hệ quản trị viên nếu bạn cho rằng đây là nhầm lẫn.
    </p>

    <div class="btn-group">
        <a th:href="@{/static}" href="/static" class="btn-primary-red">
            <i class="bi bi-house"></i> Về trang chủ
        </a>
        <a th:href="@{/login}" href="/login" class="btn-outline">
            <i class="bi bi-box-arrow-in-right"></i> Đăng nhập lại
        </a>
    </div>

    <hr class="divider">

    <div class="contact-hint">
        Cần hỗ trợ? Liên hệ <a href="#">quản trị viên</a>
    </div>

</div>

</body>
</html>
