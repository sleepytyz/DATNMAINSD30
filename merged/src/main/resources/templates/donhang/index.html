<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Quản Lý Đơn Hàng - FS Shop</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <meta name="successMess" th:content="${successMess}">
    <meta name="errorMess" th:content="${errorMess}">

    <style>
        /* ===== TOAST ===== */
        .toast-container-custom {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            max-width: 420px;
            width: 100%;
        }
        .toast-custom {
            background: #fff;
            border-radius: 12px;
            padding: 16px 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
            border-left: 5px solid #dc3545;
            animation: slideInRight 0.4s ease;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 12px;
        }
        .toast-custom.success { border-left-color: #28a745; }
        .toast-custom.warning { border-left-color: #ffc107; }
        .toast-custom .toast-icon { font-size: 1.5rem; flex-shrink: 0; margin-top: 2px; }
        .toast-custom .toast-content { flex: 1; }
        .toast-custom .toast-title { font-weight: 700; font-size: 0.95rem; color: #2d3748; }
        .toast-custom .toast-message { font-size: 0.85rem; color: #6c757d; margin-top: 2px; }
        .toast-custom .toast-close {
            background: none;
            border: none;
            font-size: 1.2rem;
            color: #adb5bd;
            cursor: pointer;
            padding: 0 4px;
            transition: color 0.2s;
        }
        .toast-custom .toast-close:hover { color: #dc3545; }
        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes slideOutRight {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(100%); opacity: 0; }
        }

        /* ===== CUSTOM CSS ===== */
        .content-wrapper {
            width: calc(100% - 250px);
        }

        .form-control:focus, .form-select:focus {
            border-color: #c92327 !important;
            box-shadow: 0 0 0 0.25rem rgba(201, 35, 39, 0.15) !important;
        }

        /* ===== CARD ===== */
        .card-custom {
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        .card-custom:hover {
            box-shadow: 0 0.5rem 1.5rem rgba(0, 0, 0, 0.08) !important;
        }
        .card-header-custom {
            background: linear-gradient(135deg, #c92327 0%, #a01a1e 100%);
            border: none;
            padding: 14px 24px;
        }
        .card-header-custom h5 {
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: 0.3px;
            color: white;
        }
        .card-header-custom .bi {
            font-size: 1.2rem;
        }

        /* ===== FILTER ===== */
        .filter-form {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #e9ecef;
        }
        .filter-form .form-label {
            font-weight: 600;
            font-size: 0.85rem;
            color: #2d3748;
            margin-bottom: 4px;
        }
        .filter-form .form-control,
        .filter-form .form-select {
            border-radius: 8px;
            border: 1px solid #e0e0e0;
            font-size: 0.9rem;
            padding: 8px 12px;
            transition: all 0.3s ease;
        }
        .filter-form .form-control:focus,
        .filter-form .form-select:focus {
            border-color: #c92327 !important;
            box-shadow: 0 0 0 0.2rem rgba(201, 35, 39, 0.12) !important;
        }

        /* ===== TOOLBAR ===== */
        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 16px;
            padding: 12px 16px;
            background: #fff;
            border-radius: 12px;
            border: 1px solid #e9ecef;
        }
        .toolbar .toolbar-left {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .toolbar .toolbar-right {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .toolbar .btn-toolbar {
            border-radius: 8px;
            padding: 8px 18px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            border: none;
            color: white;
        }
        .toolbar .btn-reset-toolbar {
            background: #6c757d;
            color: white;
        }
        .toolbar .btn-reset-toolbar:hover {
            background: #5a6268;
            color: white;
            transform: translateY(-1px);
        }

        /* ===== TABLE ===== */
        .table-card {
            background: #fff;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            border: 1px solid #e9ecef;
        }
        .table-custom {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
            table-layout: fixed;
        }
        .table-custom thead {
            background: linear-gradient(135deg, #f8f9fa 0%, #f1f3f5 100%);
            border-bottom: 2px solid #e9ecef;
        }
        .table-custom thead th {
            padding: 12px 8px;
            font-weight: 700;
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #495057;
            border-bottom: none;
            white-space: nowrap;
            text-align: center;
        }
        .table-custom tbody tr {
            transition: all 0.2s ease;
            border-bottom: 1px solid #f1f3f5;
        }
        .table-custom tbody tr:hover {
            background: #fff5f5 !important;
        }
        .table-custom tbody td {
            padding: 10px 8px;
            vertical-align: middle;
            color: #2d3748;
            text-align: center;
            word-break: break-word;
            font-size: 0.85rem;
        }

        /* ===== ĐỘ RỘNG CÁC CỘT ===== */
        .table-custom .col-stt { width: 45px; min-width: 45px; max-width: 45px; }
        .table-custom .col-mahd { width: 100px; min-width: 100px; max-width: 100px; }
        .table-custom .col-nhanvien { width: 150px; min-width: 150px; max-width: 150px; }
        .table-custom .col-khachhang { width: 170px; min-width: 170px; max-width: 170px; }
        .table-custom .col-tongtien { width: 130px; min-width: 130px; max-width: 130px; }
        .table-custom .col-thanhtoan { width: 120px; min-width: 120px; max-width: 120px; }
        .table-custom .col-loaihoadon { width: 110px; min-width: 110px; max-width: 110px; }
        .table-custom .col-ngaytao { width: 120px; min-width: 120px; max-width: 120px; }
        .table-custom .col-trangthai { width: 130px; min-width: 130px; max-width: 130px; }
        .table-custom .col-hanhdong { width: 80px; min-width: 80px; max-width: 80px; }

        .table-custom .text-left { text-align: left; }

        /* ===== BADGE STATUS ===== */
        .badge-status {
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.72rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }
        .badge-status.cho-xac-nhan { background: #fff3cd; color: #856404; }
        .badge-status.da-xac-nhan { background: #cce5ff; color: #004085; }
        .badge-status.dang-giao { background: #d1ecf1; color: #0c5460; }
        .badge-status.hoan-thanh { background: #d4edda; color: #155724; }
        .badge-status.da-huy { background: #f8d7da; color: #721c24; }

        /* ===== ACTION BUTTONS ===== */
        .btn-action {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            border: 1px solid transparent;
            font-size: 0.85rem;
            text-decoration: none;
            cursor: pointer;
        }
        .btn-action-info { border-color: #17a2b8; color: #17a2b8; background: transparent; }
        .btn-action-info:hover { background: #17a2b8; color: white; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(23,162,184,0.25); }

        /* ===== PAGINATION ===== */
        .pagination-custom {
            display: flex;
            align-items: center;
            gap: 4px;
            margin: 0;
            padding: 0;
            list-style: none;
            flex-wrap: wrap;
        }
        .pagination-custom .page-item { display: inline-block; }
        .pagination-custom .page-item .page-link {
            border: none;
            border-radius: 8px;
            padding: 6px 14px;
            color: #495057;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.3s ease;
            background: transparent;
            min-width: 36px;
            text-align: center;
            text-decoration: none;
            display: block;
        }
        .pagination-custom .page-item .page-link:hover {
            background: #fff5f5;
            color: #c92327;
        }
        .pagination-custom .page-item.active .page-link {
            background: linear-gradient(135deg, #c92327, #a01a1e);
            color: white;
            box-shadow: 0 2px 8px rgba(201, 35, 39, 0.3);
        }
        .pagination-custom .page-item.disabled .page-link {
            color: #adb5bd;
            cursor: not-allowed;
            pointer-events: none;
        }

        /* ===== TABLE FOOTER ===== */
        .table-footer {
            background: #f8f9fa;
            padding: 12px 20px;
            border-top: 1px solid #e9ecef;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .table-footer .info-text {
            font-size: 0.88rem;
            color: #6c757d;
        }
        .table-footer .info-text strong {
            color: #2d3748;
        }

        /* ===== STATS ===== */
        .stats-bar {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }
        .stats-item {
            background: #f8f9fa;
            padding: 8px 18px;
            border-radius: 10px;
            border: 1px solid #e9ecef;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.88rem;
        }
        .stats-item .num {
            font-weight: 700;
            color: #c92327;
            font-size: 1rem;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 1200px) {
            .table-custom .col-nhanvien { width: 120px; min-width: 120px; max-width: 120px; }
            .table-custom .col-khachhang { width: 140px; min-width: 140px; max-width: 140px; }
        }
        @media (max-width: 992px) {
            .table-custom { font-size: 0.8rem; table-layout: auto; }
            .table-custom .col-nhanvien { width: 100px; min-width: 100px; max-width: 100px; }
            .table-custom .col-khachhang { width: 120px; min-width: 120px; max-width: 120px; }
            .table-custom .col-tongtien { width: 110px; min-width: 110px; max-width: 110px; }
            .toolbar { flex-direction: column; align-items: stretch; }
            .toolbar .toolbar-left, .toolbar .toolbar-right { justify-content: center; }
        }
        @media (max-width: 768px) {
            .content-wrapper { width: 100%; }
            .table-custom { font-size: 0.75rem; }
            .table-custom thead th, .table-custom tbody td { padding: 6px 5px; }
            .table-custom .col-stt { width: 30px; min-width: 30px; max-width: 30px; }
            .table-custom .col-mahd { width: 70px; min-width: 70px; max-width: 70px; }
            .table-custom .col-nhanvien { width: 80px; min-width: 80px; max-width: 80px; }
            .table-custom .col-khachhang { width: 100px; min-width: 100px; max-width: 100px; }
            .table-custom .col-tongtien { width: 90px; min-width: 90px; max-width: 90px; }
            .table-custom .col-thanhtoan { width: 90px; min-width: 90px; max-width: 90px; }
            .table-custom .col-loaihoadon { width: 80px; min-width: 80px; max-width: 80px; }
            .table-custom .col-ngaytao { width: 90px; min-width: 90px; max-width: 90px; }
            .table-custom .col-trangthai { width: 100px; min-width: 100px; max-width: 100px; }
            .table-custom .col-hanhdong { width: 60px; min-width: 60px; max-width: 60px; }
            .btn-action { width: 28px; height: 28px; font-size: 0.75rem; }
            .table-footer { flex-direction: column; align-items: flex-start; gap: 8px; }
            .pagination-custom .page-item .page-link { padding: 4px 10px; font-size: 0.75rem; min-width: 30px; }
            .badge-status { font-size: 0.6rem; padding: 3px 10px; }
            .stats-bar { gap: 10px; }
            .stats-item { font-size: 0.75rem; padding: 4px 12px; }
            .stats-item .num { font-size: 0.8rem; }
        }
        @media (max-width: 576px) {
            .filter-form { padding: 12px; }
            .table-custom { font-size: 0.7rem; }
            .table-custom thead th, .table-custom tbody td { padding: 4px 4px; }
            .table-custom .col-stt { width: 25px; min-width: 25px; max-width: 25px; }
            .table-custom .col-mahd { width: 60px; min-width: 60px; max-width: 60px; }
            .table-custom .col-nhanvien { width: 70px; min-width: 70px; max-width: 70px; }
            .table-custom .col-khachhang { width: 80px; min-width: 80px; max-width: 80px; }
            .table-custom .col-tongtien { width: 75px; min-width: 75px; max-width: 75px; }
            .table-custom .col-thanhtoan { width: 70px; min-width: 70px; max-width: 70px; }
            .table-custom .col-loaihoadon { width: 65px; min-width: 65px; max-width: 65px; }
            .table-custom .col-ngaytao { width: 75px; min-width: 75px; max-width: 75px; }
            .table-custom .col-trangthai { width: 80px; min-width: 80px; max-width: 80px; }
            .table-custom .col-hanhdong { width: 50px; min-width: 50px; max-width: 50px; }
            .btn-action { width: 24px; height: 24px; font-size: 0.65rem; border-radius: 6px; }
            .toolbar .btn-toolbar { font-size: 0.75rem; padding: 5px 12px; }
            .badge-status { font-size: 0.55rem; padding: 2px 8px; }
            .pagination-custom .page-item .page-link { padding: 3px 8px; font-size: 0.65rem; min-width: 26px; }
        }
    </style>
</head>
<body>

<div class="wrapper">

    <div sec:authorize="hasRole('ADMIN')">
        <div th:replace="fragments/sidebaradmin :: sidebar-admin"></div>
    </div>

    <div sec:authorize="hasRole('STAFF')">
        <div th:replace="fragments/sidebarstaff :: sidebar-staff"></div>
    </div>

    <div class="content-wrapper">

        <div th:replace="fragments/header :: header('Quản lý đơn hàng', 'Đơn hàng')"></div>

        <div class="content-body px-3 py-3">

            <div class="toast-container-custom" id="toastContainer"></div>

<!--            <div class="stats-bar">-->
<!--                <div class="stats-item">-->
<!--                    <i class="bi bi-receipt text-danger"></i>-->
<!--                    Tổng đơn hàng: <span class="num" th:text="${totalItems}">0</span>-->
<!--                </div>-->
<!--                <div class="stats-item">-->
<!--                    <i class="bi bi-clock-history text-warning"></i>-->
<!--                    Chờ xác nhận: <span class="num" id="statChoXacNhan" th:text="${totalChoXacNhan != null ? totalChoXacNhan : 0}">0</span>-->
<!--                </div>-->
<!--                <div class="stats-item">-->
<!--                    <i class="bi bi-check-circle text-primary"></i>-->
<!--                    Đã xác nhận: <span class="num" id="statDaXacNhan" th:text="${totalDaXacNhan != null ? totalDaXacNhan : 0}">0</span>-->
<!--                </div>-->
<!--                <div class="stats-item">-->
<!--                    <i class="bi bi-truck text-info"></i>-->
<!--                    Đang giao: <span class="num" id="statDangGiao" th:text="${totalDangGiao != null ? totalDangGiao : 0}">0</span>-->
<!--                </div>-->
<!--            </div>-->

            <div class="card card-custom mb-4 shadow-sm border-0">
                <div class="card-header-custom">
                    <h5 class="mb-0 d-flex align-items-center gap-2 py-1">
                        <i class="bi bi-funnel-fill"></i>
                        <span>Bộ lọc & Tìm kiếm đơn hàng</span>
                    </h5>
                </div>

                <div class="card-body bg-white p-4">
                    <form method="get" th:action="@{/donhang/index}" class="filter-form">
                        <div class="row g-3">
                            <div class="col-lg-3 col-md-6">
                                <label class="form-label">
                                    <i class="bi bi-hash text-danger me-1"></i>Mã đơn hàng
                                </label>
                                <input type="text" class="form-control" name="mahd" th:value="${mahd}" placeholder="Nhập mã số...">
                            </div>

                            <div class="col-lg-2 col-md-6">
                                <label class="form-label">
                                    <i class="bi bi-calendar-event text-danger me-1"></i>Từ ngày
                                </label>
                                <input type="date" class="form-control" name="ngay" th:value="${ngay}">
                            </div>

                            <div class="col-lg-2 col-md-6">
                                <label class="form-label">
                                    <i class="bi bi-calendar-event text-danger me-1"></i>Đến ngày
                                </label>
                                <input type="date" class="form-control" name="ngay2" th:value="${ngay2}">
                            </div>

                            <div class="col-lg-2 col-md-6">
                                <label class="form-label">
                                    <i class="bi bi-tag-fill text-danger me-1"></i>Trạng thái
                                </label>
                                <select name="tt" class="form-select">
                                    <option value="">-- Tất cả --</option>
                                    <option value="Chờ xác nhận" th:selected="${tt == 'Chờ xác nhận'}">Chờ xác nhận</option>
                                    <option value="Đã xác nhận" th:selected="${tt == 'Đã xác nhận'}">Đã xác nhận</option>
                                    <option value="Đang giao" th:selected="${tt == 'Đang giao'}">Đang giao</option>
                                    <option value="Đã giao" th:selected="${tt == 'Đã giao'}">Đã giao</option>
                                    <option value="Đã huỷ" th:selected="${tt == 'Đã huỷ'}">Đã huỷ</option>
                                </select>
                            </div>

                            <div class="col-lg-3 col-md-12 d-flex gap-2 align-items-end">
                                <button type="submit" class="btn text-white fw-semibold px-4 flex-grow-1 d-flex align-items-center justify-content-center gap-1" style="background: #c92327; height: 42px; border-radius: 8px;">
                                    <i class="bi bi-search"></i> Lọc dữ liệu
                                </button>
                                <a th:href="@{/donhang/index}" class="btn btn-outline-secondary fw-semibold px-4 d-flex align-items-center justify-content-center gap-1" style="height: 42px; border-radius: 8px;">
                                    <i class="bi bi-arrow-clockwise"></i>
                                </a>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Table -->
            <div class="table-card">
                <div class="table-responsive">
                    <table class="table-custom">
                        <thead>
                        <tr>
                            <th class="col-stt">#</th>
                            <th class="col-mahd">Mã HĐ</th>
                            <th class="col-nhanvien text-left">Nhân viên</th>
                            <th class="col-khachhang text-left">Khách hàng</th>
                            <th class="col-tongtien">Tổng tiền</th>
                            <th class="col-thanhtoan">Thanh toán</th>
                            <th class="col-loaihoadon">Loại HĐ</th>
                            <th class="col-ngaytao">Ngày tạo</th>
                            <th class="col-trangthai">Trạng thái</th>
                            <th class="col-hanhdong">Hành động</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="hd, stt : ${list}">
                            <td class="col-stt text-center fw-semibold" th:text="${stt.index + 1 + (currentPage * pageSize)}"></td>
                            <td class="col-mahd">
                                <span class="fw-bold text-danger" th:text="${hd.maHoaDon}"></span>
                            </td>
                            <td class="col-nhanvien text-left" th:text="${hd.maNhanVien != null ? hd.maNhanVien.hoTen : ''}"></td>
                            <td class="col-khachhang text-left" th:text="${hd.maKhachHang != null ? hd.maKhachHang.hoTen + ' - ' + hd.maKhachHang.sdt : 'Khách lẻ'}"></td>
                            <td class="col-tongtien fw-bold text-danger" th:text="${#numbers.formatDecimal(hd.tongTien, 0, 'COMMA', 0, 'POINT')} + ' ₫'"></td>
                            <td class="col-thanhtoan" th:text="${hd.phuongThucThanhToan != null ? hd.phuongThucThanhToan : 'Chưa TT'}"></td>
                            <td class="col-loaihoadon" th:text="${hd.loaiBan}"></td>
                            <td class="col-ngaytao" th:text="${#temporals.format(hd.ngayTao, 'dd/MM/yyyy HH:mm')}"></td>
                            <td class="col-trangthai">
                                <span class="badge-status"
                                      th:classappend="
                                        ${hd.trangThai == 'Chờ xác nhận'} ? 'cho-xac-nhan' :
                                        (${hd.trangThai == 'Đã xác nhận'} ? 'da-xac-nhan' :
                                        (${hd.trangThai == 'Đang giao'} ? 'dang-giao' :
                                        (${hd.trangThai == 'Đã giao'} ? 'hoan-thanh' :
                                        'da-huy')))"
                                      th:text="${hd.trangThai}">
                                </span>
                            </td>
                            <td class="col-hanhdong">
                                <a class="btn-action btn-action-info"
                                   th:href="@{/donhang/detail(mahd=${hd.maHoaDon})}"
                                   title="Xem chi tiết">
                                    <i class="bi bi-eye"></i>
                                </a>
                            </td>
                        </tr>

                        <!-- Empty state -->
                        <tr th:if="${#lists.isEmpty(list)}">
                            <td colspan="10" class="text-center text-muted py-4">
                                <i class="bi bi-inbox" style="font-size: 2rem; display: block; margin-bottom: 8px;"></i>
                                Không có đơn hàng nào phù hợp
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Table Footer with Pagination -->
                <div class="table-footer" th:if="${totalPages > 0}">
                    <div class="info-text">
                        <i class="bi bi-database me-1"></i>
                        Tổng: <strong th:text="${totalItems}">0</strong> bản ghi
                        <span class="mx-1">|</span>
                        Trang <strong th:text="${currentPage + 1}">1</strong> / <strong th:text="${totalPages}">1</strong>
                    </div>

                    <nav aria-label="Page navigation">
                        <ul class="pagination-custom">
                            <!-- First -->
                            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                                <a class="page-link" th:href="@{/donhang/index(page=0, mahd=${mahd}, tt=${tt}, ngay=${ngay}, ngay2=${ngay2})}">
                                    <i class="bi bi-chevron-double-left"></i>
                                </a>
                            </li>

                            <!-- Prev -->
                            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                                <a class="page-link" th:href="@{/donhang/index(page=${currentPage - 1}, mahd=${mahd}, tt=${tt}, ngay=${ngay}, ngay2=${ngay2})}">
                                    <i class="bi bi-chevron-left"></i>
                                </a>
                            </li>

                            <!-- Pages -->
                            <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                                th:if="${i >= 0 && i < totalPages && (
                                    (i >= currentPage - 2 && i <= currentPage + 2) ||
                                    i == 0 ||
                                    i == totalPages - 1
                                )}"
                                th:classappend="${currentPage == i} ? 'active' : ''">

                                <span class="page-link" th:if="${i == 2 && currentPage > 3}" style="border: none; background: transparent; cursor: default;">...</span>

                                <a class="page-link" th:unless="${i == 2 && currentPage > 3}"
                                   th:href="@{/donhang/index(page=${i}, mahd=${mahd}, tt=${tt}, ngay=${ngay}, ngay2=${ngay2})}"
                                   th:text="${i + 1}">
                                </a>

                                <span class="page-link" th:if="${i == totalPages - 3 && currentPage < totalPages - 4}" style="border: none; background: transparent; cursor: default;">...</span>
                            </li>

                            <!-- Next -->
                            <li class="page-item" th:classappend="${currentPage + 1 >= totalPages} ? 'disabled'">
                                <a class="page-link" th:href="@{/donhang/index(page=${currentPage + 1}, mahd=${mahd}, tt=${tt}, ngay=${ngay}, ngay2=${ngay2})}">
                                    <i class="bi bi-chevron-right"></i>
                                </a>
                            </li>

                            <!-- Last -->
                            <li class="page-item" th:classappend="${currentPage + 1 >= totalPages} ? 'disabled'">
                                <a class="page-link" th:href="@{/donhang/index(page=${totalPages - 1}, mahd=${mahd}, tt=${tt}, ngay=${ngay}, ngay2=${ngay2})}">
                                    <i class="bi bi-chevron-double-right"></i>
                                </a>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // =============================================
    // TOAST
    // =============================================
    function showToast(message, type, title) {
        var container = document.getElementById('toastContainer');
        if (!container) return;

        var icons = {
            error: 'bi bi-x-circle-fill text-danger',
            success: 'bi bi-check-circle-fill text-success',
            warning: 'bi bi-exclamation-triangle-fill text-warning',
            info: 'bi bi-info-circle-fill text-info'
        };

        var titles = {
            error: 'Lỗi!',
            success: 'Thành công!',
            warning: 'Cảnh báo!',
            info: 'Thông tin'
        };

        var toast = document.createElement('div');
        toast.className = 'toast-custom ' + type;
        toast.innerHTML = `
            <div class="toast-icon"><i class="${icons[type] || icons.success}"></i></div>
            <div class="toast-content">
                <div class="toast-title">${title || titles[type] || 'Thông báo'}</div>
                <div class="toast-message">${message}</div>
            </div>
            <button class="toast-close" onclick="this.closest('.toast-custom').remove()">
                <i class="bi bi-x"></i>
            </button>
        `;
        container.appendChild(toast);

        setTimeout(function() {
            if (toast.parentNode) {
                toast.style.animation = 'slideOutRight 0.3s ease forwards';
                setTimeout(function() { toast.remove(); }, 300);
            }
        }, 5000);
    }

    // =============================================
    // DOM READY
    // =============================================
    document.addEventListener("DOMContentLoaded", function() {
        var successMsg = document.querySelector('meta[name="successMess"]')?.getAttribute('content') || '';
        var errorMsg = document.querySelector('meta[name="errorMess"]')?.getAttribute('content') || '';

        if (successMsg && successMsg !== '' && successMsg !== 'null' && successMsg !== 'undefined') {
            showToast(successMsg, 'success');
        }
        if (errorMsg && errorMsg !== '' && errorMsg !== 'null' && errorMsg !== 'undefined') {
            showToast(errorMsg, 'error');
        }
    });

    // =============================================
    // REALTIME
    // =============================================
    (function () {
        function dat(id, v) { var e = document.getElementById(id); if (e && v != null) e.textContent = v; }
        function capNhatBoDem() {
            fetch('/api/quan-ly/thong-ke-don-hang').then(function (r) { return r.json(); }).then(function (k) {
                dat('statChoXacNhan', k.choXacNhan); dat('statDaXacNhan', k.daXacNhan);
                dat('statDangGiao', k.dangGiao); dat('statDaGiao', k.daGiao);
            }).catch(function () {});
        }
        window.addEventListener('fs-don-hang', function (ev) {
            capNhatBoDem();
        });
    })();
</script>

</body>
</html>
